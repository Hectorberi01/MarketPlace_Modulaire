
name: marketplace-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: "Production"
  # Export OpenTelemetry (traces + métriques) vers le collector → Prometheus/Tempo.
  # Vide = export désactivé (pas de data dans Grafana). Renseigné via OTEL_ENDPOINT.
  Otel__Endpoint: "${OTEL_ENDPOINT:-}"
  # Utiliser l'endpoint DIRECT (sans « -pooler ») pour les migrations EF.
  ConnectionStrings__Marketplace: "${MARKETPLACE_CONNECTION:?MARKETPLACE_CONNECTION requis (chaine Npgsql Neon)}"
  # Redis protégé par mot de passe (backplane SignalR + cache).
  Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD requis},abortConnect=false"
  Jwt__Issuer: "marketplace"
  Jwt__Audience: "marketplace"
  Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY requis}"
  # Validation des comptes par un administrateur — voir le compose de staging.
  # Défaut strict : toute inscription publique attend un aval humain.
  # Bascule sans redéploiement via le .env (puis `--tags deploy`).
  Identity__Registration__RequireApprovalForBuyers: "${REQUIRE_APPROVAL_BUYERS:-true}"
  Identity__Registration__RequireApprovalForAdminCreated: "${REQUIRE_APPROVAL_ADMIN_CREATED:-false}"
  # ─────────────────────────────────────────────────────────────────────────────
  # FEDAPAY — encaissements ET versements. Les trois variables sont OBLIGATOIRES.
  #
  # Elles étaient toutes en `:-` (défaut silencieux), avec deux conséquences que rien
  # ne signalait au démarrage :
  #
  #   • BaseUrl retombait sur le BAC À SABLE. La production parlait au sandbox :
  #     aucun encaissement réel, aucun versement possible. C'était déjà le bug une
  #     première fois — le commentaire précédent le racontait, tout en laissant le
  #     défaut fautif en place.
  #
  #   • WebhookSecret vide en production = LE DÉMARRAGE EST REFUSÉ (garde-fou dans
  #     PaymentsModuleInstaller). Ce commentaire affirmait auparavant que les rappels
  #     seraient « rejetés » ; c'était l'inverse — `VerifyFedaPaySignature` retournait
  #     `true` sur secret vide, donc TOUS les rappels étaient acceptés, signés ou non.
  #     Le `:?` ci-dessous était la seule protection réelle, et il ne couvrait ni le
  #     staging ni un démarrage hors compose. Le garde-fou vit désormais dans le code.
  #
  # `:?` fait échouer le `docker compose up` si la variable manque. Bruyant au
  # déploiement plutôt que silencieux en exploitation.
  # ─────────────────────────────────────────────────────────────────────────────
  Payments__FedaPay__BaseUrl: "${FEDAPAY_BASE_URL:?FEDAPAY_BASE_URL requis (https://api.fedapay.com/v1 en production)}"
  Payments__FedaPay__ApiKey: "${FEDAPAY_API_KEY:?FEDAPAY_API_KEY requis}"
  Payments__FedaPay__WebhookSecret: "${FEDAPAY_WEBHOOK_SECRET:?FEDAPAY_WEBHOOK_SECRET requis (sans lui les rappels de paiement sont rejetés)}"
  # Versements réels FedaPay (retraits vendeur). true = payout FedaPay réel (clé requise) ; false = simulé.
  Payments__FedaPay__EnablePayouts: "${FEDAPAY_ENABLE_PAYOUTS:-false}"
  # Cloudflare R2 — pièces KYB (bucket privé).
  #
  # Les trois identifiants S3 sont OBLIGATOIRES : ils servent AUSSI au bucket
  # d'images produit (voir plus bas). Vides, le dépôt des pièces KYB et l'envoi des
  # photos échouent en silence — un vendeur ne peut plus être validé, ni publier un
  # produit, sans que rien ne l'explique. Les noms de buckets et URL publiques
  # restent optionnels : ils ont des valeurs sensées côté application.
  Storage__CloudflareR2__AccountId: "${R2_ACCOUNT_ID:?R2_ACCOUNT_ID requis (pieces KYB et images produit)}"
  Storage__CloudflareR2__AccessKeyId: "${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID requis}"
  Storage__CloudflareR2__SecretAccessKey: "${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY requis}"
  Storage__CloudflareR2__BucketName: "${R2_BUCKET_NAME:-}"
  Storage__CloudflareR2__PublicBaseUrl: "${R2_PUBLIC_BASE_URL:-}"
  # Cloudflare R2 — images produit (bucket public).
  Storage__CloudflareR2Media__AccountId: "${R2_ACCOUNT_ID:-}"
  Storage__CloudflareR2Media__AccessKeyId: "${R2_ACCESS_KEY_ID:-}"
  Storage__CloudflareR2Media__SecretAccessKey: "${R2_SECRET_ACCESS_KEY:-}"
  Storage__CloudflareR2Media__BucketName: "${R2_MEDIA_BUCKET_NAME:-}"
  Storage__CloudflareR2Media__PublicBaseUrl: "${R2_MEDIA_PUBLIC_BASE_URL:-}"
  Storage__CloudflareR2Media__KeyPrefix: "${R2_MEDIA_KEY_PREFIX:-}"
  # ── UN BUCKET PAR USAGE DE MÉDIA ───────────────────────────────────────────
  #
  # NOMMER un bucket suffit à le faire CRÉER au démarrage. Il ne reçoit des
  # téléversements que le jour où son domaine public est renseigné LUI AUSSI :
  # un bucket R2 fraîchement créé est PRIVÉ, et l'API S3 ne sait pas lui rattacher
  # de domaine — c'est une étape manuelle du tableau de bord Cloudflare.
  #
  # Tant que l'URL manque, l'usage retombe sur le bucket par défaut ci-dessus, et
  # les images continuent de s'afficher. C'est le point : la bascule se fait en
  # renseignant une variable, pas en redéployant du code.
  Storage__CloudflareR2Media__AutoCreateBuckets: "${R2_MEDIA_AUTO_CREATE_BUCKETS:-true}"
  Storage__CloudflareR2Media__Buckets__CategoryImage__BucketName: "${R2_MEDIA_BUCKET_CATEGORIES:-}"
  Storage__CloudflareR2Media__Buckets__CategoryImage__PublicBaseUrl: "${R2_MEDIA_URL_CATEGORIES:-}"
  Storage__CloudflareR2Media__Buckets__ContentBanner__BucketName: "${R2_MEDIA_BUCKET_BANNERS:-}"
  Storage__CloudflareR2Media__Buckets__ContentBanner__PublicBaseUrl: "${R2_MEDIA_URL_BANNERS:-}"
  # Logo ET couverture d'une boutique partagent le même bucket : même propriétaire,
  # même durée de vie, même visibilité. Seule la racine de clé les sépare.
  Storage__CloudflareR2Media__Buckets__ShopLogo__BucketName: "${R2_MEDIA_BUCKET_SHOPS:-}"
  Storage__CloudflareR2Media__Buckets__ShopLogo__PublicBaseUrl: "${R2_MEDIA_URL_SHOPS:-}"
  Storage__CloudflareR2Media__Buckets__ShopBanner__BucketName: "${R2_MEDIA_BUCKET_SHOPS:-}"
  Storage__CloudflareR2Media__Buckets__ShopBanner__PublicBaseUrl: "${R2_MEDIA_URL_SHOPS:-}"
  Storage__CloudflareR2Media__Buckets__Avatar__BucketName: "${R2_MEDIA_BUCKET_AVATARS:-}"
  Storage__CloudflareR2Media__Buckets__Avatar__PublicBaseUrl: "${R2_MEDIA_URL_AVATARS:-}"
  # PIÈCES JOINTES DE CONVERSATION ET DE LITIGE. Le bucket est séparé pour qu'on
  # PUISSE lui retirer son domaine public le jour où la lecture passera en URL
  # présignée — sans retoucher un seul appelant. Tant qu'un domaine y est rattaché,
  # ces images restent lisibles par quiconque possède l'URL.
  Storage__CloudflareR2Media__Buckets__ChatAttachment__BucketName: "${R2_MEDIA_BUCKET_CHAT:-}"
  Storage__CloudflareR2Media__Buckets__ChatAttachment__PublicBaseUrl: "${R2_MEDIA_URL_CHAT:-}"
  # ─────────────────────────────────────────────────────────────────────────────
  # Détourage d'image — LOCAL (service `rembg` ci-dessous), sans service tiers.
  #
  # Vider REMBG_URL désactive proprement la fonction : l'image reste inchangée et les
  # interfaces cessent de promettre un détourage (drapeau de capacité).
  #
  # MODÈLE : « u2net » (Apache 2.0 / MIT). NE PAS basculer sur un modèle BRIA
  # (« bria-rmbg ») : ses poids sont en CC BY-NC 4.0, donc interdits sur une place de
  # marché. Le code refuse d'ailleurs de les activer.
  # ─────────────────────────────────────────────────────────────────────────────
  Media__Rembg__BaseUrl: "${REMBG_URL-http://rembg:7000}"
  Media__Rembg__Model: "${REMBG_MODEL:-u2net}"
  # Firebase Cloud Messaging (push). JSON écrit par Ansible depuis le vault dans
  # deploy/fcm/service-account.json, monté en RO (voir volumes de x-app-common).
  # Fichier absent -> NullPushSender (aucun push, pas d'erreur).
  Notifications__Fcm__ServiceAccountPath: "/run/secrets/fcm/service-account.json"
  # E-mails transactionnels (Resend). SANS EUX, L'API REFUSE DE DÉMARRER EN PRODUCTION.
  #
  # Ce n'est pas une précaution excessive : sans canal e-mail, aucun compte ne peut être
  # vérifié et AUCUN mot de passe oublié ne peut être récupéré — les utilisateurs se
  # retrouvent définitivement enfermés dehors, et l'exploitant ne l'apprend que par les
  # plaintes. C'est ce vide qui avait poussé quelqu'un à renvoyer le jeton de
  # réinitialisation dans la réponse HTTP d'un endpoint anonyme (prise de contrôle de
  # n'importe quel compte). Mieux vaut un démarrage refusé qu'une plateforme qui « tourne »
  # dans cet état.
  #
  # From  : le domaine doit être VÉRIFIÉ chez Resend (SPF + DKIM), sinon 403 à chaque envoi.
  # AppBaseUrl : base des liens cliquables, ex. https://${ROOT_DOMAIN}
  Notifications__Email__ApiKey: "${RESEND_API_KEY:-}"
  Notifications__Email__From: "${EMAIL_FROM:-}"
  Notifications__Email__AppBaseUrl: "${EMAIL_APP_BASE_URL:-}"

x-app-common: &app-common
  restart: always
  logging: *logging
  # DEUX RÉSEAUX, et les quatre services qui partagent cet ancrage sont exposés : l'API
  # (webhooks des PSP) et les trois BFF. `marketplace-net` pour joindre redis et rembg,
  # `proxy` pour être joignables par le Traefik du VPS. Le label
  # `traefik.docker.network` de chaque service dit auquel des deux le proxy doit parler.
  networks: [marketplace-net, proxy]
  # Compte de service Firebase (push FCM) monté en lecture seule dans TOUS les
  # hôtes (api + BFF, dont bff-admin qui envoie le push de test au vendeur).
  volumes:
    - ./fcm:/run/secrets/fcm:ro
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 40s
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 640M

services:
  # ---------------- Détourage d'image (local, sans service tiers) ----------------
  # AUCUN `ports:`, AUCUN label Traefik. CE SERVICE NE DOIT JAMAIS ÊTRE PUBLIÉ :
  # il n'a NI authentification NI limitation de débit, et son endpoint GET
  # /api/remove va chercher une URL pour le compte de l'appelant. La 2.0.75 y a ajouté
  # un filtrage des adresses privées, mais un endpoint d'inférence libre reste une
  # invitation au déni de service. Réseau interne uniquement.
  #
  # AUCUN service applicatif n'en DÉPEND : un `depends_on: service_healthy` ferait
  # attendre toute la pile derrière le démarrage de ce conteneur, pour une fonction
  # de confort. rembg absent, la création de produit marche — la photo n'est
  # simplement pas détourée, et les consoles cessent de l'annoncer.
  rembg:
    # Version ÉPINGLÉE, pas `latest` : `--no-ui` n'existe pas avant la 2.0.75, et le
    # correctif de la CVE-2026-40086 (traversée de chemin, non authentifiée) y est
    # arrivé en même temps. Un `pull` qui ramènerait une image antérieure produirait
    # soit une boucle de redémarrage, soit une régression de sécurité silencieuse.
    image: danielgatis/rembg:2.0.77
    restart: unless-stopped
    # `--threads 2` BORNE LES INFÉRENCES SIMULTANÉES.
    #
    # Sans lui, rembg exécute chaque détourage dans le pool de threads anyio, dont la
    # limite par défaut est 40. Huit photos par vendeur, quelques vendeurs en même
    # temps, et le conteneur tente quarante inférences u2net de front : il est tué
    # pour dépassement mémoire bien avant de saturer le processeur.
    command: ["s", "--host", "0.0.0.0", "--port", "7000", "--no-ui", "--threads", "${REMBG_THREADS:-2}"]
    environment:
      # Threads INTERNES à une inférence ONNX. Ne borne PAS le nombre d'inférences
      # simultanées — c'est le rôle de `--threads` dans la commande ci-dessus.
      OMP_NUM_THREADS: "${REMBG_THREADS:-2}"
    volumes:
      # MONTÉ SUR /root/.u2net, l'emplacement PAR DÉFAUT — surtout pas ailleurs.
      #
      # L'image amont exécute `rembg d u2net` à la construction : u2net.onnx est déjà
      # dans une couche, à cet endroit. Le déplacer avec U2NET_HOME écartait ce
      # fichier et FORÇAIT un téléchargement de 176 Mo au premier appel — à
      # l'intérieur de la requête d'un vendeur, donc au-delà du délai imparti.
      #
      # Un volume nommé, lui, est initialisé avec le contenu du dossier de l'image :
      # le modèle est là dès le premier démarrage, et tout modèle téléchargé plus
      # tard survit aux redémarrages.
      - rembgmodels:/root/.u2net
    healthcheck:
      # `/api` est la page de documentation OpenAPI : elle ne charge aucun modèle, ce
      # qui en fait une sonde honnête (« le service répond ») sans coût de calcul.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/api').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # Le modèle est déjà dans l'image (et dans le volume) : il ne reste que le
      # démarrage d'uvicorn. Pas besoin des trois minutes qu'exigeait un
      # téléchargement à froid.
      start_period: 60s
    logging: *logging
    networks: [marketplace-net]
    deploy:
      resources:
        limits:
          memory: "${REMBG_MEMORY:-2G}"
          cpus: "${REMBG_CPUS:-2}"

  # ---------------- Redis (backplane + cache) ----------------
  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD requis}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    networks: [marketplace-net]

  # ---------------- Monolithe modulaire (migrateur) ----------------
  api:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bootstrap/Marketplace.Api/Marketplace.Api.csproj
        APP_DLL: Marketplace.Api.dll
    image: ${IMAGE_PREFIX:-marketplace}/api:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "true"
      # Amorçage du PREMIER administrateur (idempotent ; ignoré si ADMIN_EMAIL ou
      # ADMIN_PASSWORD est vide). Ne réinitialise jamais un compte existant.
      # Uniquement sur l'API : c'est le seul hôte qui migre/seed. Voir ENV-PROD.md.
      Identity__Bootstrap__AdminEmail: "${ADMIN_EMAIL:-}"
      Identity__Bootstrap__AdminPassword: "${ADMIN_PASSWORD:-}"
      Identity__Bootstrap__AdminFirstName: "${ADMIN_FIRST_NAME:-Admin}"
      Identity__Bootstrap__AdminLastName: "${ADMIN_LAST_NAME:-Plateforme}"
      Identity__Bootstrap__AdminPhone: "${ADMIN_PHONE:-+22900000000}"
    # ═════════════════════════════════════════════════════════════════════════════
    # PLUS DE `depends_on: postgres`, PARCE QU'IL N'Y A PLUS DE POSTGRES ICI.
    #
    # Il y en avait un, avec `required: false` pour survivre au jour où la base
    # partirait sur sa propre machine. Ce jour est passé : les services `postgres` et
    # `postgres-dispatch` ont été retirés de ce fichier le 17/10/2026, avec le profil
    # `local-db` qui les tenait éteints.
    #
    # L'API N'ATTEND DONC PLUS SA BASE AU DÉMARRAGE, et c'est le comportement normal
    # d'une base distante : rien sur cet hôte ne sait si le VPS base est prêt. Ce que
    # l'API fait à la place, elle le faisait déjà — elle applique ses migrations au
    # démarrage et échoue franchement si la base ne répond pas.
    # ═════════════════════════════════════════════════════════════════════════════
    depends_on:
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"

      # ─────────────────────────────────────────────────────────────────────────
      # SURFACE PUBLIQUE RÉDUITE AUX SEULS RAPPELS DES PSP.
      #
      # AVANT : `Host(`api.${ROOT_DOMAIN}`)` exposait l'API ENTIÈRE sur Internet.
      # Combiné à l'absence de FallbackPolicy, cela laissait un anonyme supprimer le
      # catalogue, changer les prix, manipuler le stock, créer des utilisateurs et
      # toucher au règlement des vendeurs.
      #
      # Or AUCUN client n'appelle cette API : l'app cliente parle à `m.`, l'app
      # vendeur à `seller.`, les consoles à `admin.` et `seller.`, le site à personne.
      # La seule chose qui DOIT joindre l'API depuis l'extérieur, ce sont les webhooks
      # des prestataires de paiement — et le retour de redirection du navigateur après
      # le paiement.
      #
      # Tout le reste est désormais injoignable depuis Internet : Traefik répond 404
      # sans même transmettre la requête. C'est une défense en profondeur : même si un
      # `RequireAuthorization()` était oublié demain, la route ne serait pas atteignable.
      #
      # SI VOUS AJOUTEZ UN ENDPOINT QUI DOIT ÊTRE APPELÉ DE L'EXTÉRIEUR (un nouveau
      # PSP, par exemple), il faut l'ajouter ICI, sinon il répondra 404 — et le
      # symptôme (« le PSP ne nous rappelle jamais ») ne pointera pas vers ce fichier.
      # ─────────────────────────────────────────────────────────────────────────
      - "traefik.http.routers.api.rule=Host(`api.${ROOT_DOMAIN}`) && (PathPrefix(`/api/payments/webhooks`) || PathPrefix(`/api/payments/return`))"
      - "traefik.http.routers.api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.api.middlewares=api-sec@docker,api-rl@docker,api-gz@docker"
      # En-têtes de sécurité durcis + HSTS.
      - "traefik.http.middlewares.api-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.api-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.api-sec.headers.browserXssFilter=true"
      - "traefik.http.middlewares.api-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.api-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.api-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.api-sec.headers.stsPreload=true"
      - "traefik.http.middlewares.api-sec.headers.customResponseHeaders.X-Gateway=traefik"
      - "traefik.http.middlewares.api-sec.headers.customResponseHeaders.Server="
      # Débit par client, et compression.
      - "traefik.http.middlewares.api-rl.ratelimit.average=100"
      - "traefik.http.middlewares.api-rl.ratelimit.burst=50"
      - "traefik.http.middlewares.api-gz.compress=true"
      # Deux réseaux sur ce conteneur : on DÉSIGNE celui que le proxy doit utiliser.
      - "traefik.docker.network=${TRAEFIK_PROXY_NETWORK:-proxy}"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  # ---------------- BFF ----------------
  bff-client:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bff/Marketplace.Bff.Client/Marketplace.Bff.Client.csproj
        APP_DLL: Marketplace.Bff.Client.dll
    image: ${IMAGE_PREFIX:-marketplace}/bff-client:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "false"
      OUTBOX_ENABLED: "false"
      # Origines du SITE (navigateur). VIDE = REPLI FERMÉ : aucune origine acceptée.
      # Un repli ouvert avec AllowCredentials laisserait n'importe quel site agir au
      # nom d'un acheteur connecté — panier, adresses, paiement.
      Cors__Origins: "${CLIENT_WEB_ORIGINS:-}"
      # Fiche App Store de l'app PROD (fr.hbamarket.app).
      MobileApp__UpdateUrlIos: "https://apps.apple.com/app/id6786785756"
      DeepLink__AppStoreUrl: "https://apps.apple.com/app/id6786785756"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # ─────────────────────────────────────────────────────────────────────
      # « m. » EST UN NOM HISTORIQUE, ET IL RESTE.
      #
      # Cette surface ne sert plus seulement le mobile : depuis la fusion des BFF
      # Mobile et Web, elle sert aussi le site. Le renommer coûterait un
      # enregistrement DNS et un certificat, pour un gain cosmétique — et une
      # migration ratée sur l'hôte du checkout se paie cher.
      #
      # LE SITE PUBLIC N'EST PAS ICI. Il vivra sur `www.` (image hbaexpress-site,
      # pas encore déployée) et appellera ce BFF EN CROSS-ORIGIN : c'est ce que la
      # politique CORS ci-dessus autorise, et c'est pour cela qu'elle existe.
      # ─────────────────────────────────────────────────────────────────────
      - "traefik.http.routers.client.rule=Host(`m.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.client.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.client.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.client.middlewares=client-sec@docker,client-rl@docker,client-gz@docker"
      # En-têtes de sécurité durcis + HSTS.
      - "traefik.http.middlewares.client-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.client-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.client-sec.headers.browserXssFilter=true"
      - "traefik.http.middlewares.client-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.client-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.client-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.client-sec.headers.stsPreload=true"
      - "traefik.http.middlewares.client-sec.headers.customResponseHeaders.X-Gateway=traefik"
      - "traefik.http.middlewares.client-sec.headers.customResponseHeaders.Server="
      # Débit par client, et compression.
      - "traefik.http.middlewares.client-rl.ratelimit.average=100"
      - "traefik.http.middlewares.client-rl.ratelimit.burst=50"
      - "traefik.http.middlewares.client-gz.compress=true"
      # Deux réseaux sur ce conteneur : on DÉSIGNE celui que le proxy doit utiliser.
      - "traefik.docker.network=${TRAEFIK_PROXY_NETWORK:-proxy}"
      - "traefik.http.services.client.loadbalancer.server.port=8080"


  bff-seller:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bff/Marketplace.Bff.Seller/Marketplace.Bff.Seller.csproj
        APP_DLL: Marketplace.Bff.Seller.dll
    image: ${IMAGE_PREFIX:-marketplace}/bff-seller:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "false"
      OUTBOX_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seller.rule=Host(`seller.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.seller.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.seller.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.seller.middlewares=seller-sec@docker,seller-rl@docker,seller-gz@docker"
      # En-têtes de sécurité durcis + HSTS.
      - "traefik.http.middlewares.seller-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.seller-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.seller-sec.headers.browserXssFilter=true"
      - "traefik.http.middlewares.seller-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.seller-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.seller-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.seller-sec.headers.stsPreload=true"
      - "traefik.http.middlewares.seller-sec.headers.customResponseHeaders.X-Gateway=traefik"
      - "traefik.http.middlewares.seller-sec.headers.customResponseHeaders.Server="
      # Débit par client, et compression.
      - "traefik.http.middlewares.seller-rl.ratelimit.average=100"
      - "traefik.http.middlewares.seller-rl.ratelimit.burst=50"
      - "traefik.http.middlewares.seller-gz.compress=true"
      # Deux réseaux sur ce conteneur : on DÉSIGNE celui que le proxy doit utiliser.
      - "traefik.docker.network=${TRAEFIK_PROXY_NETWORK:-proxy}"
      - "traefik.http.services.seller.loadbalancer.server.port=8080"

  bff-admin:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bff/Marketplace.Bff.Admin/Marketplace.Bff.Admin.csproj
        APP_DLL: Marketplace.Bff.Admin.dll
    image: ${IMAGE_PREFIX:-marketplace}/bff-admin:${IMAGE_TAG:-latest}
    environment:
      <<: *app-env
      # CORS : la console admin est une app navigateur servie depuis une autre
      # origine. Sans déclaration, la politique reste FERMÉE et le navigateur
      # bloque tout. En PRODUCTION : uniquement l'origine réelle de la console,
      # jamais localhost.
      Cors__Origins: "${ADMIN_CORS_ORIGINS:-https://admin.${ROOT_DOMAIN}}"
      RunMigrationsAtStartup: "false"
      OUTBOX_ENABLED: "false"
      # Supervision (page Système) : surfaces jointes par NOM DE SERVICE Docker,
      # pas localhost (défaut dev d'appsettings.json).
      #
      # LA LISTE SUIT LE DÉCOUPAGE PAR AUDIENCE. « BFF Mobile » et « BFF Web » ont
      # fusionné en « BFF Client ». Une surface oubliée ici n'est pas surveillée — et
      # son absence ne produit aucune erreur, juste une ligne manquante que personne
      # ne cherche.
      #
      # ═══════════════════════════════════════════════════════════════════════════
      # CES SONDES SURVIVENT AU RETRAIT DE LA SUPERVISION, ET CE N'EST PAS UN OUBLI.
      #
      # Elles n'ont RIEN à voir avec Prometheus : le BFF Admin interroge lui-même
      # `/health` et `/health/ready` de chaque service par le réseau Docker, et la
      # console affiche le résultat. C'est la seule page qui dit encore « l'API
      # répond » sans dépendre d'une machine tierce — à conserver pour cette raison
      # précise.
      #
      # LES INDICES SONT POSITIONNELS. Retirer « BFF Driveur » (indice 4) et le
      # dispatch (5) sans renuméroter aurait laissé un trou ; .NET arrête de lier
      # un tableau au premier indice manquant, et les surfaces suivantes auraient
      # disparu en silence. Il n'y en avait pas après, mais la règle reste.
      # ═══════════════════════════════════════════════════════════════════════════
      Monitoring__Surfaces__0__Name: "API"
      Monitoring__Surfaces__0__Url: "http://api:8080"
      Monitoring__Surfaces__1__Name: "BFF Client"
      Monitoring__Surfaces__1__Url: "http://bff-client:8080"
      Monitoring__Surfaces__2__Name: "BFF Vendeur"
      Monitoring__Surfaces__2__Url: "http://bff-seller:8080"
      Monitoring__Surfaces__3__Name: "BFF Admin"
      Monitoring__Surfaces__3__Url: "http://bff-admin:8080"
      # ═══════════════════════════════════════════════════════════════════════════
      # QUATRE URL QUI DÉSIGNENT DÉSORMAIS UNE AUTRE MACHINE.
      #
      # La pile de supervision a quitté ce serveur le 17/10/2026 : elle vit sur un VPS
      # dédié, avec sa propre configuration. Ces variables ne pointent donc plus un
      # conteneur voisin, et c'est pour cela qu'elles RESTENT : le jour où le VPS de
      # supervision publie ses URL, on les renseigne ici et la page Système retrouve
      # ses KPIs, ses tableaux de bord et ses journaux sans qu'une ligne de code
      # change.
      #
      # VIDES, LA CONSOLE MASQUE CES PANNEAUX — elle ne les affiche pas en erreur.
      # C'est l'état normal tant que les URL ne sont pas connues ; y laisser
      # « http://prometheus:9090 » aurait été le seul vrai défaut, la page attendant
      # alors un conteneur disparu à chaque ouverture.
      # ═══════════════════════════════════════════════════════════════════════════
      Monitoring__PrometheusUrl: "${PROMETHEUS_URL:-}"
      Monitoring__GrafanaUrl: "${GRAFANA_URL:-}"
      Monitoring__GrafanaEmbedUrl: "${GRAFANA_EMBED_URL:-}"
      Monitoring__LokiUrl: "${LOKI_URL:-}"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.admin.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.admin.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.admin.middlewares=admin-sec@docker,admin-rl@docker,admin-gz@docker"
      # En-têtes de sécurité durcis + HSTS.
      - "traefik.http.middlewares.admin-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.admin-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.admin-sec.headers.browserXssFilter=true"
      - "traefik.http.middlewares.admin-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.admin-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.admin-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.admin-sec.headers.stsPreload=true"
      - "traefik.http.middlewares.admin-sec.headers.customResponseHeaders.X-Gateway=traefik"
      - "traefik.http.middlewares.admin-sec.headers.customResponseHeaders.Server="
      # Débit par client, et compression.
      - "traefik.http.middlewares.admin-rl.ratelimit.average=100"
      - "traefik.http.middlewares.admin-rl.ratelimit.burst=50"
      - "traefik.http.middlewares.admin-gz.compress=true"
      # Deux réseaux sur ce conteneur : on DÉSIGNE celui que le proxy doit utiliser.
      - "traefik.docker.network=${TRAEFIK_PROXY_NETWORK:-proxy}"
      - "traefik.http.services.admin.loadbalancer.server.port=8080"

  # --- CONSOLE ADMIN (Next.js, image poussée par le dépôt HbaEpress_admin) -------
  # ---------------- Console VENDEUR (Next.js) ----------------
  # ORDRE DE MISE EN SERVICE — À LIRE AVANT LE PREMIER DÉPLOIEMENT.
  #
  # Ansible lance `docker compose up -d --no-build` sur TOUTE la pile. Si l'image
  # `seller-console` n'existe pas encore sur GHCR, ce déploiement ÉCHOUE — et il
  # emporte les autres services avec lui. C'est exactement le piège décrit plus bas
  # pour le service « site ».
  #
  # La console doit donc être publiée EN PREMIER : pousser sur `develop_staging`
  # (ou `develop`) dans HbaExpress_seller_dashboard, attendre que le workflow soit
  # vert, et seulement ensuite déployer le backend.
  # Image construite et poussée par le dépôt HbaExpress_seller_dashboard
  # (.github/workflows/deploy.yml), puis tirée ici. Ce compose ne la construit pas :
  # le backend et la console vivent dans deux dépôts distincts, avec deux cycles de
  # publication distincts.
  #
  # Le vendeur ne parle JAMAIS au BFF directement : la console détient les jetons dans
  # un cookie chiffré côté serveur et relaie les appels. D'où `SELLER_BFF_URL` sur
  # l'adresse INTERNE du réseau Docker — passer par l'URL publique ferait sortir puis
  # rentrer chaque requête par Traefik, et ferait perdre l'IP réelle du vendeur.
  seller-console:
    image: ${IMAGE_PREFIX:-marketplace}/seller-console:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [marketplace-net, proxy]
    environment:
      NODE_ENV: "production"
      SELLER_BFF_URL: "http://bff-seller:8080"
      # `:?` et non `:-` : ce secret CHIFFRE LA SESSION VENDEUR. Vide ou trop faible,
      # il la rend forgeable — donc le jeton de rafraîchissement d'un vendeur, valable
      # trente jours, devient extractible. La console refuse de servir sans lui ; ce
      # `:?` fait échouer le déploiement AVANT, ce qui est préférable à une pile qui
      # démarre et renvoie tout le monde vers la page de connexion.
      SESSION_SECRET: "${SELLER_SESSION_SECRET:?SELLER_SESSION_SECRET requis (openssl rand -base64 32, 32 caracteres minimum, pas une valeur d'exemple)}"
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      bff-seller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # ─────────────────────────────────────────────────────────────────────────
      # NOM D'HÔTE COMPLET, PAS UN SOUS-DOMAINE DE ${ROOT_DOMAIN}.
      #
      # La console vendeur est servie sur `pro.hba-express.com`, alors que toute
      # l'infrastructure vit sous `hba-express.org` (api, m, web, seller, admin,
      # console). Écrire `pro.${ROOT_DOMAIN}` aurait produit `pro.hba-express.org`
      # — un nom que personne n'a demandé, et pour lequel Let's Encrypt aurait
      # quand même émis un certificat, donnant l'illusion que tout fonctionne.
      #
      # Deux racines, deux variables. Le défaut reste `pro.${ROOT_DOMAIN}` pour que
      # le staging n'ait rien à déclarer.
      #
      # `pro.` et non `seller.` : ce dernier sert déjà le BFF vendeur. Deux routeurs
      # sur le même hôte, et Traefik en choisirait un au hasard.
      # ─────────────────────────────────────────────────────────────────────────
      - "traefik.http.routers.seller-console.rule=Host(`${SELLER_CONSOLE_DOMAIN:-pro.${ROOT_DOMAIN}}`)"
      - "traefik.http.routers.seller-console.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.seller-console.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.seller-console.middlewares=seller-console-sec@docker,seller-console-rl@docker,seller-console-gz@docker"
      # En-têtes de sécurité durcis + HSTS.
      - "traefik.http.middlewares.seller-console-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.seller-console-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.seller-console-sec.headers.browserXssFilter=true"
      - "traefik.http.middlewares.seller-console-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.seller-console-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.seller-console-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.seller-console-sec.headers.stsPreload=true"
      - "traefik.http.middlewares.seller-console-sec.headers.customResponseHeaders.X-Gateway=traefik"
      - "traefik.http.middlewares.seller-console-sec.headers.customResponseHeaders.Server="
      # Débit par client, et compression.
      - "traefik.http.middlewares.seller-console-rl.ratelimit.average=100"
      - "traefik.http.middlewares.seller-console-rl.ratelimit.burst=50"
      - "traefik.http.middlewares.seller-console-gz.compress=true"
      # Deux réseaux sur ce conteneur : on DÉSIGNE celui que le proxy doit utiliser.
      - "traefik.docker.network=${TRAEFIK_PROXY_NETWORK:-proxy}"
      - "traefik.http.services.seller-console.loadbalancer.server.port=3000"

  console:
    image: ${IMAGE_PREFIX:-marketplace}/console:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [marketplace-net, proxy]
    environment:
      NODE_ENV: "production"
      ADMIN_BFF_URL: "http://bff-admin:8080"
      # `:?` et non `:-` : ce secret CHIFFRE LA SESSION ADMINISTRATEUR. Vide, il la
      # rend forgeable. Toutes les autres variables critiques (JWT_SIGNING_KEY,
      # MARKETPLACE_CONNECTION, REDIS_PASSWORD) échouaient déjà au démarrage ;
      # celle-ci était la seule à passer en silence.
      SESSION_SECRET: "${ADMIN_SESSION_SECRET:?ADMIN_SESSION_SECRET requis (openssl rand -base64 32, minimum 32 caracteres)}"
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      bff-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # NOM D'HÔTE COMPLET, comme la console vendeur : la console publique vit sur le
      # .com, les BFF restent sur le .org. Écrire `console.${ROOT_DOMAIN}` produirait
      # `console.hba-express.org`, un domaine qu'on ne sert plus — et silencieusement.
      - "traefik.http.routers.console.rule=Host(`${ADMIN_CONSOLE_DOMAIN:-console.${ROOT_DOMAIN}}`)"
      - "traefik.http.routers.console.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.console.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.console.middlewares=console-sec@docker,console-rl@docker,console-gz@docker"
      # En-têtes de sécurité durcis + HSTS.
      - "traefik.http.middlewares.console-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.console-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.console-sec.headers.browserXssFilter=true"
      - "traefik.http.middlewares.console-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.console-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.console-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.console-sec.headers.stsPreload=true"
      - "traefik.http.middlewares.console-sec.headers.customResponseHeaders.X-Gateway=traefik"
      - "traefik.http.middlewares.console-sec.headers.customResponseHeaders.Server="
      # Débit par client, et compression.
      - "traefik.http.middlewares.console-rl.ratelimit.average=100"
      - "traefik.http.middlewares.console-rl.ratelimit.burst=50"
      - "traefik.http.middlewares.console-gz.compress=true"
      # Deux réseaux sur ce conteneur : on DÉSIGNE celui que le proxy doit utiliser.
      - "traefik.docker.network=${TRAEFIK_PROXY_NETWORK:-proxy}"
      - "traefik.http.services.console.loadbalancer.server.port=3000"

  # ---------------- Vitrine acheteur (hba-express.org) ----------------
  # Le navigateur ne joint QUE ce service ; c'est lui qui parle au BFF client, par
  # l'adresse interne Docker. Aucun jeton n'atteint la page : ils vivent dans un cookie
  # chiffré côté Next.
  #
  # ═════════════════════════════════════════════════════════════════════════════════
  # LES URL PUBLIQUES NE SE RÈGLENT PAS ICI. Elles sont figées AU BUILD de l'image.
  #
  # Next remplace les variables `NEXT_PUBLIC_*` par leur valeur pendant la compilation,
  # y compris dans le code serveur. Les poser dans ce fichier ne changerait donc rien —
  # et pire, laisserait croire qu'elles sont réglées. Vérifié : une image construite
  # sans elles sort `<loc>http://localhost:3002</loc>` dans son sitemap, quoi qu'on lui
  # passe à l'exécution.
  #
  # Elles se passent en `--build-arg` : voir docker/boutique.Dockerfile et
  # docs/mise-en-service.md du dépôt web.
  # ═════════════════════════════════════════════════════════════════════════════════
  site:
    image: ${IMAGE_PREFIX:-marketplace}/boutique:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    networks: [marketplace-net, proxy]
    environment:
      NODE_ENV: "production"
      CLIENT_BFF_URL: "http://bff-client:8080"
      # `:?` et non `:-` : ce secret CHIFFRE LA SESSION ACHETEUR. Vide, il la rend
      # forgeable. Il doit être DISTINCT de ceux des deux consoles — depuis que la
      # surface entre dans le sceau de la session, un secret partagé n'est plus
      # exploitable d'une surface à l'autre, mais rien ne justifie de le partager.
      SESSION_SECRET: "${CLIENT_SESSION_SECRET:?CLIENT_SESSION_SECRET requis (openssl rand -base64 48)}"
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      bff-client:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # Les DEUX formes sont servies : « www » est la forme canonique — c'est elle que
      # le sitemap et les balises canoniques déclarent — et l'apex répond aussi, pour qui
      # tape le domaine sans préfixe. Pas de redirection : deux hôtes sur le même
      # service, et la balise canonique dit à l'indexation laquelle compte.
      #
      # CHAQUE nom doit résoudre vers le VPS avant le premier démarrage : le certificat
      # est émis par nom d'hôte.
      - "traefik.http.routers.site.rule=Host(`${SITE_DOMAIN:-${ROOT_DOMAIN}}`) || Host(`${SITE_DOMAIN_APEX:-www.${ROOT_DOMAIN}}`)"
      - "traefik.http.routers.site.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.site.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.routers.site.middlewares=site-sec@docker,site-rl@docker,site-gz@docker"
      # En-têtes de sécurité durcis + HSTS.
      - "traefik.http.middlewares.site-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.site-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.site-sec.headers.browserXssFilter=true"
      - "traefik.http.middlewares.site-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.site-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.site-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.site-sec.headers.stsPreload=true"
      - "traefik.http.middlewares.site-sec.headers.customResponseHeaders.X-Gateway=traefik"
      - "traefik.http.middlewares.site-sec.headers.customResponseHeaders.Server="
      # Débit par client, et compression.
      - "traefik.http.middlewares.site-rl.ratelimit.average=100"
      - "traefik.http.middlewares.site-rl.ratelimit.burst=50"
      - "traefik.http.middlewares.site-gz.compress=true"
      # Deux réseaux sur ce conteneur : on DÉSIGNE celui que le proxy doit utiliser.
      - "traefik.docker.network=${TRAEFIK_PROXY_NETWORK:-proxy}"
      - "traefik.http.services.site.loadbalancer.server.port=3000"

networks:
  # Réseau INTERNE de la pile : api ↔ redis ↔ rembg. Rien n'est exposé par là.
  marketplace-net:
    name: marketplace-prod-net
  # ═══════════════════════════════════════════════════════════════════════════════
  # LE RÉSEAU DU PROXY, DÉJÀ CRÉÉ, ET QUI NE NOUS APPARTIENT PAS.
  #
  # `external: true` dit à Compose de le JOINDRE, pas de le créer : il appartient au
  # Traefik installé sur le VPS, qui y vit déjà. S'il n'existe pas, `up` échoue tout de
  # suite — « network proxy declared as external, but could not be found ». Une erreur
  # franche, bien préférable à une pile qui démarre sans être joignable.
  #
  # SEULS LES SEPT SERVICES EXPOSÉS le rejoignent. `redis` et `rembg` restent sur le
  # réseau interne : les mettre là les rendrait joignables par tout ce qui est branché
  # sur ce proxy, y compris les autres piles qu'il sert.
  # ═══════════════════════════════════════════════════════════════════════════════
  proxy:
    name: ${TRAEFIK_PROXY_NETWORK:-proxy}
    external: true

volumes:
  # ═══════════════════════════════════════════════════════════════════════════════
  # `pgdata` ET `pgdata-dispatch` NE SONT PLUS DÉCLARÉS ICI.
  #
  # Compose ne SUPPRIME pas un volume qu'on retire du fichier : s'ils existent encore
  # sur l'hôte de production, ils y restent, intacts, et `docker volume ls` les
  # montre. C'était le retour arrière de la bascule vers le VPS base ; leur
  # suppression est une décision manuelle, `docker volume rm marketplace-prod_pgdata`
  # et `..._pgdata-dispatch`, à prendre quand la bascule est acquise.
  # ═══════════════════════════════════════════════════════════════════════════════
  redisdata:
  # `acme` est parti avec le service `traefik` : le certificat est obtenu et stocké par
  # le proxy du VPS, dans SON volume. `marketplace-prod_acme` peut subsister sur l'hôte ;
  # il ne contient que d'anciens certificats, et sa suppression est manuelle.
  # Cache des modèles ONNX de rembg (sinon retéléchargés à chaque redémarrage).
  rembgmodels:
