# OpenTelemetry Collector — point d'ingestion unique.
# Reçoit OTLP (traces + métriques) des apps .NET, route vers Tempo (traces)
# et expose les métriques au format Prometheus (scrapées par Prometheus).

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  # Traces → Tempo (OTLP gRPC).
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Métriques → exposées sur :8889/metrics pour le scrape Prometheus.
  # L'exporter mappe déjà service.name → le label « job » (renommé « exported_job »
  # côté Prometheus, collision avec le job de scrape). Les dashboards ventilent
  # donc par « exported_job » : pas besoin de resource_to_telemetry_conversion.
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
