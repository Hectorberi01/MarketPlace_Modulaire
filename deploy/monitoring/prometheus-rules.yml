# ============================================================
# Règles d'alerte Prometheus — HbaExpress
# Chargé par prometheus.yml (rule_files). Les alertes apparaissent dans l'onglet
# « Alerts » de Prometheus et via la métrique ALERTS (exploitable dans Grafana).
# Pour des NOTIFICATIONS (email/Slack/webhook), brancher un Alertmanager (voir doc).
#
# Certaines alertes s'appuient sur les métriques custom (.NET) : elles ne
# s'activeront qu'une fois l'API redéployée avec la couche de métriques.
# ============================================================

groups:
  # ---------------------------------------------------------------------------
  - name: api-availability
    rules:
      - alert: ApiDown
        expr: api_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "API indisponible ({{ $labels.service_name }})"
          description: "api_up = 0 depuis 1 min pour {{ $labels.service_name }}."

      - alert: DependencyUnhealthy
        expr: dependency_health_status < 1
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Dépendance dégradée/indisponible : {{ $labels.dependency }}"
          description: "dependency_health_status={{ $value }} pour {{ $labels.dependency }} depuis 2 min."

      - alert: FrequentRestarts
        expr: resets(application_restart_total[15m]) > 2
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Redémarrages fréquents ({{ $labels.service_name }})"
          description: "Plus de 2 redémarrages en 15 min."

  # ---------------------------------------------------------------------------
  - name: http-errors-latency
    rules:
      - alert: High5xxErrorRate
        # Taux de 5xx > 2 % sur 5 min, uniquement s'il y a du trafic (> 0.1 req/s).
        expr: |
          (
            sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
            /
            sum(rate(http_server_request_duration_seconds_count[5m]))
          ) * 100 > 2
          and
          sum(rate(http_server_request_duration_seconds_count[5m])) > 0.1
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "Taux d'erreurs 5xx élevé (> 2 %)"
          description: "Taux 5xx global = {{ $value | printf \"%.2f\" }} % sur 5 min."

      - alert: EndpointHigh5xx
        # Plusieurs 500 sur un même endpoint.
        expr: sum by (exported_job, http_route) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Erreurs 5xx sur {{ $labels.http_route }} ({{ $labels.exported_job }})"
          description: "Endpoint {{ $labels.http_route }} en erreur 5xx de façon soutenue."

      - alert: HighLatencyP95
        # P95 par route > 1.5 s pendant 10 min (ajuster le seuil par endpoint critique).
        expr: histogram_quantile(0.95, sum by (le, http_route) (rate(http_server_request_duration_seconds_bucket[5m]))) > 1.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Latence P95 élevée sur {{ $labels.http_route }}"
          description: "P95 = {{ $value | printf \"%.2f\" }} s (> 1.5 s) depuis 10 min."

  # ---------------------------------------------------------------------------
  - name: host-vps
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "CPU VPS > 80 %"
          description: "CPU = {{ $value | printf \"%.0f\" }} % depuis 5 min."

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "RAM VPS > 85 %"
          description: "Mémoire = {{ $value | printf \"%.0f\" }} %."

      - alert: HostDiskWarning
        expr: 100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100) > 80
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Disque > 80 % ({{ $labels.mountpoint }})"
          description: "Utilisation = {{ $value | printf \"%.0f\" }} %."

      - alert: HostDiskCritical
        expr: 100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} * 100) > 90
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "Disque CRITIQUE > 90 % ({{ $labels.mountpoint }})"
          description: "Utilisation = {{ $value | printf \"%.0f\" }} %."

      - alert: NodeExporterDown
        expr: up{job="node"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "node-exporter injoignable"
          description: "Métriques VPS indisponibles depuis 2 min."

  # ---------------------------------------------------------------------------
  - name: containers
    rules:
      - alert: ContainerHighCpu
        expr: sum by (image) (rate(container_cpu_usage_seconds_total{name!=""}[5m])) > 0.9
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Conteneur CPU élevé ({{ $labels.image }})"
          description: "CPU ~ {{ $value | printf \"%.2f\" }} cœur sur 10 min."

      - alert: ContainerHighMemory
        # Mémoire conteneur proche de sa limite (si une limite est fixée).
        expr: (container_memory_usage_bytes{name!=""} / container_spec_memory_limit_bytes{name!=""} > 0.85) and (container_spec_memory_limit_bytes{name!=""} > 0)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Conteneur mémoire > 85 % de sa limite ({{ $labels.image }})"
          description: "Mémoire = {{ $value | printf \"%.2f\" }} de la limite (ratio, seuil 0.85)."

  # ---------------------------------------------------------------------------
  - name: redis
    rules:
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Redis indisponible"
          description: "redis_up = 0 depuis 1 min."

      - alert: RedisHighMemory
        expr: (redis_memory_used_bytes / redis_memory_max_bytes * 100 > 80) and (redis_memory_max_bytes > 0)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Mémoire Redis > 80 %"
          description: "Mémoire = {{ $value | printf \"%.0f\" }} % du max."

      - alert: RedisEvictions
        expr: rate(redis_evicted_keys_total[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Redis évince des clés"
          description: "Des clés sont évincées (mémoire insuffisante ou maxmemory-policy)."

      - alert: RedisLowHitRate
        # Hit rate < 80 % pendant 15 min, uniquement s'il y a du trafic cache.
        expr: |
          (
            rate(redis_keyspace_hits_total[5m])
            /
            (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m]))
          ) * 100 < 80
          and
          (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) > 1
        for: 15m
        labels: { severity: warning }
        annotations:
          summary: "Cache hit rate Redis bas (< 80 %)"
          description: "Hit rate = {{ $value | printf \"%.0f\" }} %."

  # ---------------------------------------------------------------------------
  - name: payments
    rules:
      - alert: PaymentHighFailureRate
        # Taux d'échec > 20 % sur 15 min, avec un minimum de tentatives.
        expr: |
          (
            sum(rate(payment_failed_total[15m]))
            /
            sum(rate(payment_attempts_total[15m]))
          ) * 100 > 20
          and
          sum(rate(payment_attempts_total[15m])) > 0.01
        for: 10m
        labels: { severity: critical }
        annotations:
          summary: "Taux d'échec des paiements élevé (> 20 %)"
          description: "Taux d'échec = {{ $value | printf \"%.0f\" }} % sur 15 min."

      - alert: PaymentWebhookErrors
        expr: sum by (provider) (rate(payment_webhook_errors_total[10m])) > 0
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Erreurs de webhook paiement ({{ $labels.provider }})"
          description: "Webhooks {{ $labels.provider }} en erreur depuis 10 min."

  # ---------------------------------------------------------------------------
  - name: security
    rules:
      - alert: LoginFailureSpike
        expr: sum(rate(login_failed_total[5m])) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Pic d'échecs de connexion"
          description: "{{ $value | printf \"%.2f\" }} échecs/s sur 5 min."

      - alert: FrequentRateLimiting
        expr: sum(rate(rate_limit_exceeded_total[5m])) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Rate limiting déclenché fréquemment"
          description: "{{ $value | printf \"%.2f\" }} req/s bloquées (429)."

      - alert: UnauthorizedForbiddenSpike
        expr: sum(rate(unauthorized_requests_total[5m])) + sum(rate(forbidden_requests_total[5m])) > 2
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Pic de 401/403"
          description: "Beaucoup de requêtes refusées (auth/autorisation)."

  # ---------------------------------------------------------------------------
  # OUTBOX — LA FILE QUI PORTE TOUS LES FAITS MÉTIER ENTRE MODULES.
  #
  # Une LETTRE MORTE n'est pas un incident technique : c'est un fait métier qui ne se
  # produira JAMAIS. Un e-mail de réinitialisation jamais envoyé (utilisateur enfermé
  # dehors), un gain vendeur jamais crédité (de l'argent dû qui n'existe nulle part),
  # un stock jamais libéré (article invendable).
  #
  # Avant, ces messages étaient rejoués toutes les 5 secondes, pour l'éternité :
  # intenable, mais BRUYANT — ça finissait par se voir. En posant un plafond de
  # tentatives, on a supprimé le bruit. Cette alerte est ce qui le remplace. Sans elle,
  # on aurait troqué une boucle visible contre une perte silencieuse — et ce serait pire.
  - name: outbox
    rules:
      - alert: OutboxDeadLetter
        # UN SEUL suffit à réveiller quelqu'un. Pas de seuil, pas de tolérance : chaque
        # lettre morte est une promesse rompue, et elle exige une action humaine
        # (corriger la cause, puis rejouer via /admin/outbox/dead-letters).
        expr: increase(outbox_dead_letters_total[10m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "LETTRE MORTE dans l'outbox — module {{ $labels.module }}"
          description: >-
            Un événement {{ $labels.event_type }} du module {{ $labels.module }} a été
            ABANDONNÉ après épuisement de ses tentatives. Il ne sera JAMAIS traité.
            Diagnostiquer la cause, la corriger, puis rejouer :
            GET /admin/outbox/dead-letters.

      - alert: OutboxPublishFailuresHigh
        # Les échecs isolés sont normaux (le réseau tombe, un fournisseur hoquette) : le
        # backoff les absorbe. Un TAUX SOUTENU, en revanche, annonce des lettres mortes
        # dans les deux heures qui viennent. C'est l'alerte qui laisse le temps d'agir.
        expr: sum(rate(outbox_publish_failures_total[5m])) by (module) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Échecs de publication soutenus — outbox {{ $labels.module }}"
          description: >-
            Le module {{ $labels.module }} échoue à publier ses événements depuis 10 min.
            Sans correction, ces messages partiront en lettre morte (10 tentatives, ~2 h).

  # ═══════════════════════════════════════════════════════════════════════════
  # SERVICE DE DISPATCH — les deux pannes qui ne font aucun bruit.
  #
  # Ce service est déployé à part et n'a pas de client au bout du fil pour se plaindre :
  # ses échecs ne produisent aucune erreur HTTP. Deux d'entre eux coûtent de l'argent ou
  # une commande perdue, et aucun ne se verrait sans ces règles.
  # ═══════════════════════════════════════════════════════════════════════════
  - name: dispatch
    rules:
      - alert: DispatchOutboundDeadLetter
        # LA MÊME LOGIQUE QUE OutboxDeadLetter, ET LE MÊME ENJEU : un seul suffit.
        # Un message sortant abandonné, c'est presque toujours une course LIVRÉE dont la
        # rémunération n'a jamais été annoncée à la marketplace. Le coursier a travaillé,
        # et rien ne le paiera sans intervention — il n'existe aucun rattrapage
        # automatique une fois la file épuisée.
        expr: increase(dispatch_outbound_dead_letters_total[10m]) > 0
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "MESSAGE SORTANT ABANDONNÉ — service de dispatch"
          description: >-
            Un message {{ $labels.message_type }} n'a pas pu être transmis à la
            marketplace après 10 tentatives. S'il s'agit d'une course livrée, LA
            RÉMUNÉRATION DU COURSIER N'A PAS ÉTÉ VERSÉE. Diagnostiquer (marketplace
            joignable ? secret correct ? montant refusé par le plafond ?), corriger, puis
            rejouer à la main depuis la table dispatch.outbound_messages.

      - alert: DispatchOutboundFailuresHigh
        # L'alerte qui laisse le temps d'agir : à ce rythme, les abandons arrivent dans
        # les deux heures.
        expr: sum(rate(dispatch_outbound_send_failures_total[5m])) > 0.2
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Échecs d'envoi soutenus — service de dispatch"
          description: >-
            Le service de dispatch échoue à joindre la marketplace depuis 10 min. Sans
            correction, ces messages partiront en abandon (10 tentatives) et des courses
            livrées resteront impayées.

      - alert: DispatchJobExpired
        # UNE COURSE QUE PERSONNE N'A ACCEPTÉE EN CINQ MINUTES.
        #
        # Le repli en cascade vers un prestataire externe n'existe pas encore : derrière
        # cette expiration, il n'y a personne. C'est un acheteur qui attend une livraison
        # que rien ne viendra faire, et aucune erreur ne le signale.
        #
        # Un seuil, contrairement aux lettres mortes : une expiration isolée peut arriver
        # un dimanche matin sans coursier en ligne. Trois en dix minutes, c'est que le
        # dispatch ne trouve plus personne — problème de flotte, de zone ou de rayon.
        expr: increase(dispatch_jobs_expired_total[10m]) > 2
        for: 0m
        labels: { severity: critical }
        annotations:
          summary: "Courses sans livreur — service de dispatch"
          description: >-
            Plusieurs courses ont expiré sans qu'aucun coursier ne les accepte. Le repli
            en cascade n'étant pas branché, ces commandes n'ont PLUS DE LIVREUR et doivent
            être traitées à la main. Vérifier le nombre de coursiers en ligne, leurs zones
            de service et la fraîcheur de leurs positions.

  - name: security-vps
    rules:
      - alert: SshBruteForce
        # Rafale de tentatives SSH échouées = attaque par force brute en cours.
        # Fail2ban bannit déjà l'IP, mais on veut le SAVOIR.
        expr: increase(ssh_failed_total[5m]) > 20
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Force brute SSH détectée sur le VPS"
          description: >-
            Plus de 20 tentatives SSH échouées en 5 min. Fail2ban devrait bannir
            l'IP ; vérifier les logs (Loki : {job="auth"} |= "Failed password").

      - alert: RootLogin
        # Une connexion root ne devrait pas arriver en temps normal (on passe par
        # un compte + sudo). Toute occurrence mérite un coup d'œil.
        expr: increase(ssh_root_login_total[5m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Ouverture de session root sur le VPS"
          description: "Une session root a été ouverte. Confirmer qu'elle est légitime."

      - alert: Fail2banBanSpike
        # Pic de bannissements : attaque distribuée ou scan agressif.
        expr: increase(fail2ban_banned_total[15m]) > 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Pic de bannissements Fail2ban"
          description: "Plus de 5 IP bannies en 15 min — activité hostile soutenue."
