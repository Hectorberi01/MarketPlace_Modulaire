# Provisionne les dashboards JSON du dossier json/ (UID fixes, versionnés).
apiVersion: 1

providers:
  - name: "marketplace"
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json
      foldersFromFilesStructure: false
