# Promtail — récupère les logs des conteneurs Docker et les pousse vers Loki.
# Les apps .NET logguent en JSON compact sur stdout (Serilog) : Loki reçoit donc
# des logs structurés, requêtables par « service », « level », etc.

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  # Persisté sur un volume (voir docker-compose) → promtail se souvient de sa
  # position entre redémarrages et ne re-pousse pas tout l'historique.
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Nom du conteneur (sans le « / » initial) → label « container ».
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # Compose project / service, si présents.
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"
      # Flux (stdout/stderr).
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"
    pipeline_stages:
      # Les logs Serilog sont du JSON : on extrait niveau + message + service.
      # Les clés Serilog « @l », « @m » ne sont pas des identifiants JMESPath
      # valides tels quels (« @ » = nœud courant) → il faut les mettre entre
      # guillemets dans l'expression : JMESPath '"@l"' = clé littérale « @l ».
      - json:
          expressions:
            level: '"@l"'
            message: '"@m"'
            svc: service
      - labels:
          level:
          svc:

  # ── Sécurité : authentification système (SSH, sudo, root) ──────────────────
  # /var/log/auth.log de l'hôte (monté en RO). rsyslog est garanti par le rôle
  # Ansible « security ». On expédie les lignes à Loki ET on émet des compteurs
  # Prometheus (via /metrics de Promtail) pour les alertes.
  - job_name: system-auth
    static_configs:
      - targets: [localhost]
        labels:
          job: auth
          __path__: /var/log/host/auth.log
    pipeline_stages:
      # Compteur : tentatives SSH échouées (brute-force, mauvais mot de passe…).
      - regex:
          expression: '(?P<ssh_failed>Failed password|Invalid user|authentication failure|Connection closed by authenticating user)'
      - metrics:
          ssh_failed_total:
            type: Counter
            description: "Tentatives d'authentification SSH échouées"
            source: ssh_failed
            config:
              action: inc
      # Compteur : ouvertures de session root.
      - regex:
          expression: '(?P<ssh_root>session opened for user root)'
      - metrics:
          ssh_root_login_total:
            type: Counter
            description: "Ouvertures de session root"
            source: ssh_root
            config:
              action: inc

  # ── Sécurité : Fail2ban (bannissements) ───────────────────────────────────
  - job_name: fail2ban
    static_configs:
      - targets: [localhost]
        labels:
          job: fail2ban
          __path__: /var/log/host/fail2ban.log
    pipeline_stages:
      - regex:
          expression: '(?P<f2b_ban>\bBan\b)'
      - metrics:
          fail2ban_banned_total:
            type: Counter
            description: "IP bannies par Fail2ban"
            source: f2b_ban
            config:
              action: inc
