
name: marketplace

x-app-env: &app-env
  ConnectionStrings__Marketplace: "${MARKETPLACE_CONNECTION:-Host=postgres;Port=5432;Database=${POSTGRES_DB:-marketplace};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}}"
  Redis__ConnectionString: "redis:6379"
  Jwt__Issuer: "marketplace"
  Jwt__Audience: "marketplace"
  Jwt__SigningKey: "${JWT_SIGNING_KEY}"
  # FedaPay : la clé secrète reste dans deploy/.env (gitignoré). Renseignée → l'adaptateur réel s'active ; vide → stub sandbox.
  Payments__FedaPay__BaseUrl: "${FEDAPAY_BASE_URL:-https://sandbox-api.fedapay.com/v1}"
  Payments__FedaPay__ApiKey: "${FEDAPAY_API_KEY:-}"
  Payments__FedaPay__WebhookSecret: "${FEDAPAY_WEBHOOK_SECRET:-}"
  # Versements réels FedaPay (retraits vendeur). true = payout FedaPay réel (clé requise) ; false = simulé.
  Payments__FedaPay__EnablePayouts: "${FEDAPAY_ENABLE_PAYOUTS:-false}"
  # Cloudflare R2 : stockage des pièces KYB. Renseigné → adaptateur R2 réel ; vide → stub hors-ligne.
  # ── Pièces KYB : le MinIO local, par défaut ────────────────────────────────
  #
  # Nouvelle section « Storage:KybStorage », qui ne nomme plus un fournisseur.
  # L'ancienne « Storage:CloudflareR2 » reste lue en repli par l'installeur, le
  # temps que tous les environnements aient migré.
  #
  # Les valeurs par défaut visent le conteneur `minio` : un `docker compose up`
  # suffit désormais à exercer le vrai chemin de stockage, là où c'était le stub
  # hors-ligne qui répondait. Pour viser R2 depuis un poste de développement,
  # renseigner MINIO_ENDPOINT à vide et R2_ACCOUNT_ID.
  Storage__KybStorage__ServiceUrl: "${KYB_ENDPOINT:-http://minio:9000}"
  Storage__KybStorage__AccountId: "${R2_ACCOUNT_ID:-}"
  Storage__KybStorage__AccessKeyId: "${KYB_ACCESS_KEY:-${MINIO_ROOT_USER:-minioadmin}}"
  Storage__KybStorage__SecretAccessKey: "${KYB_SECRET_KEY:-${MINIO_ROOT_PASSWORD:-minioadmin}}"
  Storage__KybStorage__BucketName: "${KYB_BUCKET:-hbaexpress-kyb}"
  Storage__KybStorage__Region: "${MINIO_REGION:-us-east-1}"
  # VIDE, et délibérément : une pièce d'identité ne se lit que par URL présignée.
  Storage__KybStorage__PublicBaseUrl: ""
  # Cloudflare R2 (images produit) : bucket PUBLIC distinct du KYB. Renseigné → R2 réel.
  Storage__CloudflareR2Media__AccountId: "${R2_ACCOUNT_ID:-}"
  Storage__CloudflareR2Media__AccessKeyId: "${R2_ACCESS_KEY_ID:-}"
  Storage__CloudflareR2Media__SecretAccessKey: "${R2_SECRET_ACCESS_KEY:-}"
  Storage__CloudflareR2Media__BucketName: "${R2_MEDIA_BUCKET_NAME:-}"
  Storage__CloudflareR2Media__PublicBaseUrl: "${R2_MEDIA_PUBLIC_BASE_URL:-}"
  Storage__CloudflareR2Media__KeyPrefix: "${R2_MEDIA_KEY_PREFIX:-}"
  # ── UN BUCKET PAR USAGE DE MÉDIA ───────────────────────────────────────────
  #
  # NOMMER un bucket suffit à le faire CRÉER au démarrage. Il ne reçoit des
  # téléversements que le jour où son domaine public est renseigné LUI AUSSI :
  # un bucket R2 fraîchement créé est PRIVÉ, et l'API S3 ne sait pas lui rattacher
  # de domaine — c'est une étape manuelle du tableau de bord Cloudflare.
  #
  # Tant que l'URL manque, l'usage retombe sur le bucket par défaut ci-dessus, et
  # les images continuent de s'afficher. C'est le point : la bascule se fait en
  # renseignant une variable, pas en redéployant du code.
  Storage__CloudflareR2Media__AutoCreateBuckets: "${R2_MEDIA_AUTO_CREATE_BUCKETS:-true}"
  Storage__CloudflareR2Media__Buckets__CategoryImage__BucketName: "${R2_MEDIA_BUCKET_CATEGORIES:-}"
  Storage__CloudflareR2Media__Buckets__CategoryImage__PublicBaseUrl: "${R2_MEDIA_URL_CATEGORIES:-}"
  Storage__CloudflareR2Media__Buckets__ContentBanner__BucketName: "${R2_MEDIA_BUCKET_BANNERS:-}"
  Storage__CloudflareR2Media__Buckets__ContentBanner__PublicBaseUrl: "${R2_MEDIA_URL_BANNERS:-}"
  # Logo ET couverture d'une boutique partagent le même bucket : même propriétaire,
  # même durée de vie, même visibilité. Seule la racine de clé les sépare.
  Storage__CloudflareR2Media__Buckets__ShopLogo__BucketName: "${R2_MEDIA_BUCKET_SHOPS:-}"
  Storage__CloudflareR2Media__Buckets__ShopLogo__PublicBaseUrl: "${R2_MEDIA_URL_SHOPS:-}"
  Storage__CloudflareR2Media__Buckets__ShopBanner__BucketName: "${R2_MEDIA_BUCKET_SHOPS:-}"
  Storage__CloudflareR2Media__Buckets__ShopBanner__PublicBaseUrl: "${R2_MEDIA_URL_SHOPS:-}"
  Storage__CloudflareR2Media__Buckets__Avatar__BucketName: "${R2_MEDIA_BUCKET_AVATARS:-}"
  Storage__CloudflareR2Media__Buckets__Avatar__PublicBaseUrl: "${R2_MEDIA_URL_AVATARS:-}"
  # PIÈCES JOINTES DE CONVERSATION ET DE LITIGE. Le bucket est séparé pour qu'on
  # PUISSE lui retirer son domaine public le jour où la lecture passera en URL
  # présignée — sans retoucher un seul appelant. Tant qu'un domaine y est rattaché,
  # ces images restent lisibles par quiconque possède l'URL.
  Storage__CloudflareR2Media__Buckets__ChatAttachment__BucketName: "${R2_MEDIA_BUCKET_CHAT:-}"
  Storage__CloudflareR2Media__Buckets__ChatAttachment__PublicBaseUrl: "${R2_MEDIA_URL_CHAT:-}"

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  # Le bucket KYB doit exister avant le premier téléversement, sinon l'erreur est
  # « NoSuchBucket » — qu'on attribue longtemps à une signature fausse plutôt qu'à
  # un bucket manquant. `service_completed_successfully` : minio-init crée le
  # bucket puis s'arrête, il n'a pas d'état « sain » à attendre.
  minio-init:
    condition: service_completed_successfully

x-healthcheck: &app-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
  interval: 15s
  timeout: 5s
  retries: 10
  start_period: 40s

services:
  # ---------------- Infrastructure ----------------
  postgres:
    image: postgres:16-alpine
    # Marge de connexions : plusieurs hôtes (API + 4 BFF) ouvrent des pools.
    command: ["postgres", "-c", "max_connections=300"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Port hôte 5434 -> 5432 du conteneur (5434 pour ne pas heurter un Postgres
      # local sur 5432/5433). Connexion client : localhost:5434.
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [marketplace-net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [marketplace-net]

  # ---------------- Stockage objet (pièces KYB) ----------------
  #
  # POURQUOI IL EST ICI ALORS QU'IL N'Y ÉTAIT PAS.
  #
  # En développement, `IKybDocumentStorage` se résolvait vers le stub hors-ligne :
  # aucun identifiant configuré, donc aucun stockage réel. Le chemin qui téléverse
  # une pièce d'identité, signe une requête en SigV4 et relit par URL présignée
  # n'était donc JAMAIS exercé ailleurs qu'en production — et c'est exactement le
  # genre d'écart qui laisse survivre un défaut jusqu'à ce qu'il compte.
  #
  # Le même service tourne sur le VPS base en production, en systemd plutôt qu'en
  # conteneur. Ce qui est identique, et c'est ce qui compte, c'est le protocole :
  # SigV4 en path-style, sur un endpoint configurable.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
      # La MÊME région que celle avec laquelle l'application signe. Une divergence
      # donne « SignatureDoesNotMatch », sans dire que la région est en cause.
      MINIO_REGION: "${MINIO_REGION:-us-east-1}"
    ports:
      # Sur la boucle locale uniquement : même en développement, un stockage objet
      # ouvert sur toutes les interfaces d'un poste portable est un partage de
      # fichiers involontaire dès qu'on se connecte à un réseau public.
      - "127.0.0.1:9000:9000"   # API S3
      - "127.0.0.1:9001:9001"   # console d'administration
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [marketplace-net]

  # Crée le bucket au démarrage, puis s'arrête. Sans lui, le premier téléversement
  # échoue sur « NoSuchBucket » — une erreur qu'on met du temps à attribuer à un
  # bucket manquant plutôt qu'à une signature fausse.
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/${KYB_BUCKET:-hbaexpress-kyb} &&
      mc anonymous set none local/${KYB_BUCKET:-hbaexpress-kyb} &&
      echo 'bucket KYB prêt'
      "
    networks: [marketplace-net]

  # ---------------- Edge gateway ----------------
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    ports:
      - "80:80"        # entrypoint web (clients)
      - "8080:8080"    # dashboard Traefik (dev uniquement)
    volumes:
      # Plus de montage du socket Docker : routage via le provider « file ».
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks: [marketplace-net]

  # ---------------- Monolithe modulaire ----------------
  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bootstrap/Marketplace.Api/Marketplace.Api.csproj
        APP_DLL: Marketplace.Api.dll
    environment:
      <<: *app-env
      # L'Api est le migrateur : elle applique les migrations de tous les modules
      # au démarrage. Les BFF attendent qu'elle soit saine.
      RunMigrationsAtStartup: "true"
    depends_on: *app-depends
    healthcheck: *app-healthcheck
    networks: [marketplace-net]

  # ---------------- BFF ----------------
  bff-client:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bff/Marketplace.Bff.Client/Marketplace.Bff.Client.csproj
        APP_DLL: Marketplace.Bff.Client.dll
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "false"
      # L'outbox ne tourne que dans l'API : évite N×hôtes connexions Postgres.
      OUTBOX_ENABLED: "false"
      # Origines du site en développement (Vite). Vide = repli FERMÉ.
      Cors__Origins: "${CLIENT_WEB_ORIGINS:-http://localhost:5173}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [marketplace-net]


  bff-seller:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bff/Marketplace.Bff.Seller/Marketplace.Bff.Seller.csproj
        APP_DLL: Marketplace.Bff.Seller.dll
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "false"
      # L'outbox ne tourne que dans l'API : évite N×hôtes connexions Postgres.
      OUTBOX_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [marketplace-net]

  bff-admin:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bff/Marketplace.Bff.Admin/Marketplace.Bff.Admin.csproj
        APP_DLL: Marketplace.Bff.Admin.dll
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "false"
      # L'outbox ne tourne que dans l'API : évite N×hôtes connexions Postgres.
      OUTBOX_ENABLED: "false"
    depends_on:
      api:
        condition: service_healthy
    healthcheck: *app-healthcheck
    networks: [marketplace-net]

networks:
  marketplace-net:
    name: marketplace-net

volumes:
  pgdata:
  redisdata:
  miniodata:
