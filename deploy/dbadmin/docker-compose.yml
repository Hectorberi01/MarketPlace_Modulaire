# ⚠️  ADMIN BASE DE DONNÉES (pgweb) — ACCÈS LECTURE À LA BASE DE PROD.
#
# pgweb ouvre une interface web : navigation dans les schémas/tables + éditeur SQL.
# Trois protections superposées :
#   1. Connexion en tant qu'utilisateur PostgreSQL `readonly` (SELECT uniquement) ;
#   2. pgweb en mode --readonly (bloque tout ce qui n'est pas SELECT) ;
#   3. Traefik DEVANT : liste blanche d'IP + auth HTTP (middleware dbadmin-guard).
#
# Déployé UNIQUEMENT si enable_db_admin=true. Sans IP autorisée ni utilisateur
# d'auth (vault), le middleware REFUSE tout : deny-by-default.
services:
  dbadmin:
    image: sosedoff/pgweb:0.16.2
    # ⚠️ L'ENTRYPOINT de l'image est déjà [/usr/bin/pgweb --bind=0.0.0.0
    # --listen=8081]. Le « command » ci-dessous est APPENDÉ à l'entrypoint : il ne
    # doit donc contenir QUE les arguments supplémentaires (ni le binaire, ni --bind,
    # ni --listen — sinon pgweb reçoit un argument positionnel invalide et plante).
    command:
      # Connexion figée (flags séparés → pas de piège d'échappement sur le mot de
      # passe). L'utilisateur ne peut pas changer de connexion (--lock-session).
      - "--host=${DBADMIN_PG_HOST}"
      - "--port=${DBADMIN_PG_PORT}"
      - "--user=${DBADMIN_PG_USER}"
      - "--pass=${DBADMIN_PG_PASS}"
      - "--db=${DBADMIN_PG_DB}"
      - "--ssl=disable"
      - "--lock-session"
      # Ceinture + bretelles : même si le rôle readonly était mal configuré, pgweb
      # refuse toute requête non-SELECT.
      - "--readonly"
    networks: [traefik]
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dbadmin.rule=Host(`${DBADMIN_HOST}`)"
      - "traefik.http.routers.dbadmin.entrypoints=websecure"
      - "traefik.http.routers.dbadmin.tls.certresolver=letsencrypt"
      # dbadmin-guard = ipAllowList (deny-all par défaut) + basicAuth + en-têtes.
      - "traefik.http.routers.dbadmin.middlewares=dbadmin-guard@file"
      - "traefik.http.services.dbadmin.loadbalancer.server.port=8081"

networks:
  # Réseau applicatif (= traefik_network) : permet À LA FOIS le routage Traefik ET
  # d'atteindre le conteneur `postgres` (alias réseau) pour s'y connecter.
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
