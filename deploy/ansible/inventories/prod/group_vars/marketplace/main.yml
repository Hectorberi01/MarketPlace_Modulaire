---
# Variables NON sensibles de la production (les secrets sont dans vault.yml).
target_env: prod
compose_file: docker-compose.prod.yml
app_dir: /opt/marketplace

# --- Mode déploiement : le serveur ne fait que PULL depuis GHCR (pas de build). ---
# La CI build+push les images (tag « latest » pour prod). Images privées → le token
# de pull va dans vault.yml : registry_token (login auto avant le pull).
use_registry: true
image_prefix: ghcr.io/hectorberi01
image_tag: latest
registry_host: ghcr.io
registry_username: hectorberi01

# ═══════════════════════════════════════════════════════════════════════════════
# OÙ VIT LA BASE — LE SEUL INTERRUPTEUR DE LA MIGRATION.
#
# `false` : la base est le conteneur `postgres` du compose, sur cette machine.
#           C'est l'état actuel de la production.
# `true`  : la base est le VPS dédié, joint par le tunnel WireGuard.
#
# CE DRAPEAU NE MIGRE RIEN. Il dit seulement où l'application doit se connecter.
# Le retourner sans avoir restauré les données sur le VPS base ferait démarrer
# l'API sur une base VIDE — et comme elle applique ses migrations au démarrage,
# elle créerait les 26 schémas, sèmerait l'admin, et se déclarerait en bonne santé.
# La plateforme remonterait vide, sans une seule erreur, pendant que les vraies
# données dormiraient intactes sur l'autre machine.
#
# La procédure de bascule est dans docs/RUNBOOK_Bascule_Base.md. Elle se termine
# par ce drapeau, elle ne commence pas par lui.
# ═══════════════════════════════════════════════════════════════════════════════
use_external_database: false

# Construite à partir de `postgres_db` / `postgres_user` (group_vars/all), pour que
# l'identité de la base soit écrite à UN seul endroit. `marketplace_connection`
# défini à la main dans le vault reste prioritaire — voir env.j2.
#
# PAS DE `SSL Mode` : la confidentialité vient du tunnel, qui chiffre déjà tout ce
# qui passe entre les deux machines. Exiger TLS par-dessus imposerait de gérer des
# certificats côté Postgres pour rechiffrer un flux qui l'est déjà. En revanche, si
# la base cessait un jour de passer par le tunnel, cette ligne devrait changer avant
# tout le reste.
marketplace_connection_external: >-
  Host={{ wg_db_ip }};Port=5432;Database={{ app_db_name }};Username={{ app_db_user }};Password={{ postgres_password }};Maximum Pool Size={{ npgsql_max_pool_size }}

#postgresql://postgres:[YOUR-PASSWORD]@db.ajvnzrrbekltnjgzmzxl.supabase.co:5432/postgres
# Edge / TLS — ACME PRODUCTION (certificats fiables) par défaut : pas de acme_caserver.
root_domain: hba-express.org

# Console vendeur : nom d'hôte COMPLET, sur une AUTRE racine que root_domain.
# `consolevendeur.{{ root_domain }}` aurait donné « consolevendeur.hba-express.org »
# — un nom que personne n'utilise, et pour lequel Let's Encrypt aurait quand même
# émis un certificat, donnant l'illusion que tout va bien.
#
# LE FRONT SUR .COM, LE BACK SUR .ORG. Ce découpage ne coûte rien : le navigateur ne
# parle jamais au BFF, il n'appelle que la console, qui relaie côté serveur. Aucune
# requête inter-origines, donc aucun CORS à ouvrir, et le cookie de session est posé
# par Next sur sa propre origine.
#
# C'EST ICI QUE LE NOM SE CHANGE, ET NULLE PART AILLEURS. Ansible regénère le
# `.env.prod` du VPS à chaque déploiement : une valeur corrigée à la main sur le
# serveur tient jusqu'au prochain `deploy-prod.sh`, puis disparaît sans bruit.
seller_console_domain: consolevendeur.hba-express.com
acme_email: hector.adjakpa@hbatechettrade.com

# Portainer (visualisation des conteneurs) → https://portainer.$ROOT_DOMAIN
enable_portainer: true
traefik_network: marketplace-prod-net

# --- Observabilité (stack deploy/monitoring/) ---
# Déploie Grafana/Prometheus/Loki/Tempo, sur le réseau applicatif (traefik_network).
# grafana_password : à mettre dans le VAULT prod. DNS requis : grafana.$ROOT_DOMAIN → VPS.
enable_monitoring: true
grafana_host: "grafana.hba-express.org"
otel_endpoint: "http://otel-collector:4317"
prometheus_url: "http://prometheus:9090"          # interne (réseau Docker) → KPIs live
loki_url: "http://loki:3100"                       # interne → panneau Logs de la console
grafana_url: "https://grafana.hba-express.org"     # navigateur (iframe)
grafana_embed_url: "https://grafana.hba-express.org/d/app-overview/apps-net-opentelemetry?orgId=1&kiosk&theme=light"

# ═══════════════════════════════════════════════════════════════════════════════
# CANAL D'ALERTE — SANS CE BLOC, LA SUPERVISION DE PRODUCTION EST MUETTE.
#
# `enable_monitoring: true` déploie Prometheus, ses règles et Alertmanager. Aucune
# de ces trois briques ne notifie quoi que ce soit tant qu'Alertmanager n'a pas de
# destinataire : il rendait jusqu'ici des receivers vides, acceptait chaque alerte
# et la jetait. Le tableau de bord montrait des alertes rouges que personne ne
# recevait — le pire des deux mondes, puisqu'il ressemble à une supervision.
#
# Le rôle `monitoring` échoue désormais si aucun canal n'est joignable.
#
# ═══════════════════════════════════════════════════════════════════════════════
# ALERTMANAGER PASSE PAR RESEND, COMME LE RESTE DES E-MAILS.
#
# Ce fichier affirmait que Resend « ne fait pas de SMTP sortant pour un tiers » et
# renvoyait Alertmanager vers la boîte Hostinger du domaine. C'était faux : Resend
# expose une passerelle SMTP sur `smtp.resend.com`, et c'est ce qui a coûté plusieurs
# déploiements bloqués sur un mot de passe de boîte que personne n'avait sous la main.
#
# Trois conséquences concrètes :
#
#   - L'IDENTIFIANT EST LA CHAÎNE « resend », littéralement — pas une adresse.
#   - LE MOT DE PASSE EST UNE CLÉ D'API Resend, pas un mot de passe de messagerie.
#     Elle n'est donc pas soumise à l'authentification à deux facteurs de la boîte,
#     et se révoque sans toucher au courrier.
#   - L'EXPÉDITEUR DOIT APPARTENIR À UN DOMAINE VÉRIFIÉ dans Resend. `smtp_from`
#     ci-dessous utilise le domaine d'où partent déjà les e-mails transactionnels ;
#     si ce n'est plus celui qui est vérifié, l'envoi est refusé par Resend et
#     l'échec n'apparaît que dans les journaux d'Alertmanager.
#
# Port 587 = STARTTLS, ce qu'attend `smtp_require_tls: true` dans le modèle.
# `smtp_password` reste dans le VAULT — il n'a rien à faire ici.
# ═══════════════════════════════════════════════════════════════════════════════
alert_slack_channel: "#alerts"
smtp_host: "smtp.resend.com"
smtp_port: 587
smtp_from: "hector.adjakpa@hbatechettrade.com"
smtp_username: "resend"
alert_email_to: "hector.adjakpa@gmail.com"

# Battement de cœur : URL d'un service externe qui alerte quand les pings CESSENT
# (healthchecks.io, Better Stack Heartbeats, cron-monitor). C'est le SEUL mécanisme
# qui détecte une pile d'alerte morte — sans lui, « aucune alerte » et « plus rien
# ne fonctionne » se ressemblent trait pour trait. Vide = sonde inactive.
alert_heartbeat_url: ""

# R2 — noms de buckets (non sensibles)
r2_bucket_name: hbaexpress-documents-pdf
r2_public_base_url: ""
r2_media_bucket_name: habexpress-images
r2_media_key_prefix: products-images
# En prod, préférer un domaine personnalisé connecté au bucket public.
r2_media_public_base_url: "https://images.hbamediacore.fr"

# FedaPay — DOIT correspondre à ta clé : sk_live_… ⇒ URL live (ci-dessous),
# sk_sandbox_… ⇒ https://sandbox-api.fedapay.com/v1. Sinon l'API refuse de démarrer.
fedapay_base_url: "https://api.fedapay.com/v1"
# Versements réels (retraits vendeur) : garde false tant que FedaPay n'a pas activé
# les DÉPÔTS sur ton compte marchand (sinon 403 à chaque payout).
fedapay_enable_payouts: false

# E-mails transactionnels (Resend) — OBLIGATOIRE, sinon l'API refuse de démarrer.
# Le domaine de email_from DOIT être vérifié chez Resend (SPF + DKIM), sinon
# les envois échouent en 403 (le démarrage, lui, passe). Ajuste si ton domaine
# vérifié n'est pas hba-express.org. resend_api_key → vault.
# Expéditeur : le DOMAINE doit être « Verified » chez Resend (compte de resend_api_key).
# Aligné sur le domaine vérifié updates.hbatechettrade.com (le même que staging) — car
# hba-express.org n'est PAS vérifié dans ce compte (Resend renvoyait 403). Pour repasser
# sur no-reply@hba-express.org, il faut d'abord vérifier ce domaine dans Resend (SPF+DKIM).
email_from: "HBA Express <no-reply@updates.hbatechettrade.com>"
email_app_base_url: "https://hba-express.org"

# Amorçage du 1er admin : compte créé au 1er démarrage (admin_password → vault).
admin_email: "hector.adjakpa@hbatechettrade.com"


# ── Terminal web (shell de l'hôte) — ACTIVÉ en prod ──────────────────────────
# TRÈS SENSIBLE. Le rôle échoue volontairement tant que les DEUX verrous ne sont
# pas dans le VAULT prod (pas d'exposition nue) :
#   terminal_allowed_ips      : [ "TON.IP.PUBLIQUE/32" ]   (deny-all si vide)
#   terminal_basic_auth_users : [ "admin:$apr1$…" ]         (htpasswd -nbB admin '…')
#   terminal_ssh_private_key  : la clé privée wetty (paire de terminal_ssh_public_key)
# DNS REQUIS : terminal.hba-express.org → 79.137.35.129 (IP du VPS).
enable_web_terminal: true
terminal_subdomain: "terminal"
# Le VPS OVH écoute le SSH sur 8022 et n'autorise pas root : wetty se connecte en
# « ubuntu » (shell sudo-capable). La clé publique ci-dessous est ajoutée aux
# authorized_keys de cet utilisateur par le rôle.
terminal_ssh_user: "root"
terminal_ssh_port: "22"

terminal_ssh_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEyQ79kjNYRpzXXYDHLVpClN+VU4dFPBLxsVkuj+7Mxw wetty-terminal"

# ── Admin base de données (pgweb, LECTURE SEULE) — ACTIVÉ en prod ─────────────
# Sans cette activation, le rôle `dbadmin` est SAUTÉ (défaut false) : c'est
# pourquoi db.hba-express.org n'avait aucun backend en prod.
# Triple verrou : le rôle échoue volontairement tant que les secrets ne sont pas
# dans le VAULT prod (pas d'exposition nue) :
#   db_admin_allowed_ips       : [ "TON.IP.PUBLIQUE/32" ]   (deny-all si vide)
#   db_admin_basic_auth_users  : [ "admin:$apr1$…" ]         (htpasswd -nbB admin '…')
#   db_admin_readonly_password : "<mot de passe fort, sans \" ni $>"
# DNS REQUIS : db.hba-express.org → 79.137.35.129 (IP du VPS).
enable_db_admin: true
db_admin_subdomain: "db"

# ── Fail2ban — durcissement contre le brute-force LENT ───────────────────────
# Un attaquant qui espace ses tentatives (~2 toutes les ~12 min) passait sous le
# radar : avec findtime=10m / maxretry=4, le seuil n'était jamais atteint → 0 ban
# malgré 114 échecs SSH constatés. On élargit la fenêtre d'observation, on abaisse
# la tolérance et on allonge le bannissement.
fail2ban_findtime: "1h"
fail2ban_bantime: "24h"
fail2ban_sshd_maxretry: 3

# ── Vérification après déploiement : URL testées à travers Traefik ───────────
# `api` et `dispatch` n'ont un routeur que sur certains préfixes : leur racine
# renverrait un 404 de Traefik, indistinguable d'un backend sain. On vise donc pour
# ces deux-là un chemin RÉELLEMENT routé. Un 404 applicatif est un succès : il prouve
# que la requête est arrivée jusqu'à l'application.
#
# LA CONSOLE VENDEUR MANQUAIT À CETTE LISTE, ET ÇA S'EST VU. Elle est la seule
# surface servie sur une AUTRE racine, donc la seule dont le nom d'hôte puisse
# diverger sans que rien d'autre ne bouge — exactement ce qui s'est produit : un 404
# de Traefik sur `consolevendeur.hba-express.com`, découvert à la main dans un
# navigateur, alors que le déploiement s'était déclaré réussi. La vérification après
# déploiement ne valait que pour les six surfaces de `root_domain`.
post_deploy_public_urls:
  - "https://m.{{ root_domain }}/"
  - "https://seller.{{ root_domain }}/"
  - "https://admin.{{ root_domain }}/"
  - "https://driver.{{ root_domain }}/"
  - "https://api.{{ root_domain }}/api/payments/return"
  - "https://dispatch.{{ root_domain }}/api/courier"
  - "https://{{ seller_console_domain }}/api/health"
