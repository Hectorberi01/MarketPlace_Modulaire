# ═════════════════════════════════════════════════════════════════════════════════
# PRODUCTION — DEUX MACHINES, ET C'EST DÉLIBÉRÉ.
#
# `marketplace` porte l'application (API, BFF, Traefik, Redis, supervision).
# `database`    porte PostgreSQL, et rien d'autre.
#
# POURQUOI SÉPARER. La base tient l'argent : commandes, portefeuilles vendeurs,
# séquestres, retraits. La colocaliser avec six conteneurs applicatifs, un reverse
# proxy exposé et une pile d'observabilité, c'est lui faire partager le disque, la
# mémoire et la surface d'attaque de tout le reste. Un OOM déclenché par un pic de
# trafic ne doit pas pouvoir tuer Postgres en cours d'écriture.
#
# LES DEUX MACHINES SE PARLENT PAR UN TUNNEL WIREGUARD, JAMAIS PAR INTERNET.
# Postgres n'écoute que sur l'interface du tunnel (voir le rôle postgres_host) :
# il n'existe aucune route publique vers la base, même mal configurée.
# ═════════════════════════════════════════════════════════════════════════════════

[marketplace]
prod-1 ansible_host=79.137.35.129

[database]
prod-db-1 ansible_host=51.255.40.214

# ─────────────────────────────────────────────────────────────────────────────────
# Réglages communs aux deux groupes.
# ─────────────────────────────────────────────────────────────────────────────────
[prod:children]
marketplace
database

[prod:vars]
ansible_user=ubuntu
ansible_port=8022
# Clé SSH : laissée implicite pour utiliser exactement le même mécanisme que ton
# `ssh root@…` qui fonctionne (agent SSH + clés par défaut + ~/.ssh/config).
# Décommente et ajuste UNIQUEMENT si ta clé porte un nom précis et n'est pas dans l'agent.
#ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3

# ─────────────────────────────────────────────────────────────────────────────────
# LE JOUR OÙ LE VPS BASE N'AURA PLUS DE SSH PUBLIC.
#
# C'est la bonne cible : une machine qui ne porte que la base n'a aucune raison
# d'accepter des connexions depuis Internet. Ansible peut alors la joindre en
# rebondissant par le VPS applicatif, qui est déjà sur le tunnel — décommenter la
# ligne ci-dessous et remplacer l'ansible_host de prod-db-1 par 10.20.0.2.
#
# À ne faire qu'APRÈS avoir vérifié que le rebond fonctionne : si le SSH public est
# fermé et que le rebond échoue, la machine devient injoignable.
# ─────────────────────────────────────────────────────────────────────────────────
#[database:vars]
#ansible_ssh_common_args=-o ProxyJump=root@193.168.145.162
