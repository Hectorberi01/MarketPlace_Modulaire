# Serveur de production. Remplacer l'IP/host et l'utilisateur SSH.
[marketplace]
prod-1 ansible_host=193.168.145.162

[marketplace:vars]
ansible_user=root
# Clé SSH : laissée implicite pour utiliser exactement le même mécanisme que ton
