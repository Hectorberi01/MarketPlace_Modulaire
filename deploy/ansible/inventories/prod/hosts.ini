# Serveur de production. Remplacer l'IP/host et l'utilisateur SSH.
[marketplace]
prod-1 ansible_host=79.137.35.129

[marketplace:vars]
ansible_user=ubuntu
# SSH n'est pas sur le port par défaut : le VPS écoute sur 8022.
ansible_port=8022
# Clé SSH : laissée implicite pour utiliser exactement le même mécanisme que ton
# `ssh root@…` qui fonctionne (agent SSH + clés par défaut + ~/.ssh/config).
# Décommente et ajuste UNIQUEMENT si ta clé porte un nom précis et n'est pas dans l'agent.
#ansible_ssh_private_key_file=~/.ssh/id_ed25519
ansible_python_interpreter=/usr/bin/python3
