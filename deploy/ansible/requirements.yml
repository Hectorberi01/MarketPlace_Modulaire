# Collections requises. Installer avec :
#   ansible-galaxy collection install -r requirements.yml
collections:
  - name: ansible.posix      # module synchronize (rsync)
    version: ">=1.5.0"
  - name: community.docker   # (optionnel) modules Docker
    version: ">=3.4.0"
  - name: community.postgresql  # gestion des rôles, bases et pg_hba sur le VPS base
    version: ">=3.4.0"
  - name: community.general     # module ufw et divers
    version: ">=8.0.0"
