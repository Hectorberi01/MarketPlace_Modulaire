---
# Terminal web (wetty → SSH hôte). Gated par enable_web_terminal + tag webterminal.
# Exécuté APRÈS le rôle marketplace (réseau Traefik + dossier deploy/ présents).
#
# ⚠️ Sécurité : voir deploy/webterminal/docker-compose.yml. Deny-by-default via le
# middleware terminal-guard (liste blanche d'IP + auth HTTP) rendu depuis le vault.

- name: Garde-fou — refuser l'activation sans verrous configurés
  ansible.builtin.fail:
    msg: >-
      enable_web_terminal=true mais terminal_allowed_ips ET/OU
      terminal_basic_auth_users sont vides. Renseigne-les dans le vault AVANT
      d'exposer un shell root. (Le middleware refuserait de toute façon, mais on
      préfère échouer explicitement plutôt que déployer un terminal inutilisable.)
  when: (terminal_allowed_ips | default([]) | length == 0) or (terminal_basic_auth_users | default([]) | length == 0)

- name: Générer le middleware de garde du terminal (Traefik dynamic)
  ansible.builtin.template:
    src: terminal-middleware.yml.j2
    dest: "{{ app_dir }}/deploy/traefik/dynamic-{{ target_env }}/terminal.yml"
    mode: "0644"

- name: Déployer le terminal web (docker compose)
  ansible.builtin.command:
    cmd: docker compose -f deploy/webterminal/docker-compose.yml up -d
    chdir: "{{ app_dir }}"
  environment:
    TERMINAL_HOST: "{{ terminal_subdomain }}.{{ root_domain }}"
    TRAEFIK_NETWORK: "{{ traefik_network }}"
    SSH_HOST: "{{ terminal_ssh_host }}"
    SSH_PORT: "{{ terminal_ssh_port }}"
  register: terminal_up
  changed_when: true

- name: URL d'accès au terminal
  ansible.builtin.debug:
    msg: "Terminal : https://{{ terminal_subdomain }}.{{ root_domain }} — accès filtré (IP + auth HTTP + SSH)."
