---
# Sous-domaine du terminal (ex. terminal.<root_domain>).
terminal_subdomain: "terminal"
# Hôte/port SSH que wetty contacte (host-gateway → SSH de la machine).
# Port : reprend ansible_port si défini (prod = 8022), sinon 22 (défaut SSH, staging).
terminal_ssh_host: "host.docker.internal"
terminal_ssh_port: "{{ ansible_port | default(22) }}"
terminal_ssh_user: "root"
# Image wetty épinglée.
webterminal_image: "wettyoss/wetty:2.5.0"

# ── Clé SSH dédiée (auth par clé — l'hôte est en key-only) ────────────────────
# Clé PRIVÉE dans le vault (jamais committée), clé PUBLIQUE en group_vars.
# Génère la paire :  ssh-keygen -t ed25519 -f id_terminal -N '' -C 'wetty-terminal'
terminal_ssh_private_key: ""
terminal_ssh_public_key: ""

# ── VERROUS (à définir dans le vault pour que le terminal soit joignable) ──────
# Liste blanche d'IP autorisées (CIDR). VIDE = Traefik REFUSE tout le monde.
terminal_allowed_ips: []
# Utilisateurs d'auth HTTP au format htpasswd (bcrypt/apr1). VIDE = REFUSE tout.
#   Générer :  htpasswd -nbB admin 'MotDePasseFort'
terminal_basic_auth_users: []
