---
# Durcissement / observabilité sécurité du VPS.
#
# Installe Fail2ban (bannissement des IP qui brute-forcent SSH) et garantit la
# présence des journaux texte (/var/log/auth.log, /var/log/fail2ban.log) que
# Promtail expédie ensuite vers Loki. rsyslog est explicitement installé car les
# Ubuntu récents peuvent ne conserver que journald — sans lui, auth.log n'existe
# pas et il n'y a rien à collecter.

- name: Installer Fail2ban et rsyslog
  ansible.builtin.apt:
    name:
      - fail2ban
      - rsyslog
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: rsyslog démarré et activé (garantit /var/log/auth.log)
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true

- name: Configurer la jail Fail2ban (sshd)
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Redémarrer Fail2ban

- name: Fail2ban démarré et activé
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

# ── Pare-feu UFW — OPT-IN (enable_ufw), pour les « ports sollicités » ─────────
# Journalise les paquets (bloqués/autorisés) dans /var/log/ufw.log → Promtail →
# Loki : on voit alors quels ports sont scannés/sollicités.
#
# IMPORTANT : RISQUE DE LOCKOUT : activer un pare-feu à distance peut couper SSH. On
# AUTORISE donc le port SSH courant AVANT d'activer, plus 80/443. Laisser
# enable_ufw à false tant qu'on n'a pas vérifié que le port SSH est le bon.
- name: Pare-feu UFW (opt-in)
  when: enable_ufw | default(false)
  block:
    - name: Installer UFW
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Autoriser le port SSH AVANT activation (anti-lockout)
      ansible.builtin.command: "ufw allow {{ ansible_port | default(22) }}/tcp"
      changed_when: false

    - name: Autoriser HTTP et HTTPS
      ansible.builtin.command: "ufw allow {{ item }}/tcp"
      loop: ["80", "443"]
      changed_when: false

    - name: Activer la journalisation UFW (→ /var/log/ufw.log)
      ansible.builtin.command: "ufw logging on"
      changed_when: false

    - name: Activer UFW (politique entrante = deny)
      ansible.builtin.command: "ufw --force enable"
      changed_when: false
