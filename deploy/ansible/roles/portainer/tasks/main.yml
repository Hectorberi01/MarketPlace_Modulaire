---
# Déploie Portainer CE sur le réseau Traefik, exposé en HTTPS via labels.
# Nécessite que la stack applicative (donc le réseau {{ traefik_network }}) soit
# déjà en place — d'où l'exécution APRÈS le rôle marketplace.

- name: Déployer Portainer (docker compose)
  ansible.builtin.command:
    cmd: docker compose -f deploy/portainer/docker-compose.yml up -d
    chdir: "{{ app_dir }}"
  environment:
    PORTAINER_HOST: "{{ portainer_subdomain }}.{{ root_domain }}"
    TRAEFIK_NETWORK: "{{ traefik_network }}"
    PORTAINER_IMAGE: "{{ portainer_image }}"
  register: portainer_up
  changed_when: true

- name: URL d'accès Portainer
  ansible.builtin.debug:
    msg: "Portainer : https://{{ portainer_subdomain }}.{{ root_domain }} — créer le compte admin au premier accès (dans les ~5 min)."
