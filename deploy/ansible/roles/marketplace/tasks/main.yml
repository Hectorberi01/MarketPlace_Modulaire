---
# Déploiement applicatif, une étape par fichier. L'ordre compte : on contrôle, on
# synchronise, on écrit l'environnement, on tire l'image, on démarre, on vérifie.

- name: Contrôles préalables
  ansible.builtin.import_tasks: preflight.yml

- name: Synchroniser le code
  ansible.builtin.import_tasks: sync.yml

- name: Environnement et secrets montés
  ansible.builtin.import_tasks: env.yml

- name: Image applicative
  ansible.builtin.import_tasks: images.yml

- name: Pile Docker Compose
  ansible.builtin.import_tasks: compose.yml

- name: Postgres co-hébergé
  ansible.builtin.import_tasks: postgres-local.yml
  when: not (use_external_database | default(false))

- name: Vérification après déploiement
  ansible.builtin.import_tasks: verification.yml
  when: enable_post_deploy_check | default(true)
