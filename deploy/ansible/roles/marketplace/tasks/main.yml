---
# Déploiement de la stack : synchronisation du code, génération du fichier
# d'environnement (secrets Vault), build + up via docker compose.

- name: Créer le répertoire de l'application
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"
  when: not skip_sync
  # Aussi sous « monitoring » : un déploiement monitoring-only doit pouvoir
  # pousser les fichiers de conf (prometheus.yml, promtail, dashboards…).
  tags: [deploy, monitoring]

- name: Synchroniser le code source vers l'hôte
  ansible.posix.synchronize:
    src: "{{ project_local_path }}/"
    dest: "{{ app_dir }}/"
    delete: true
    recursive: true
    rsync_opts:
      - "--exclude=.git"
      - "--exclude=bin"
      - "--exclude=obj"
      - "--exclude=node_modules"
      - "--exclude=.env"
      - "--exclude=.env.*"
      - "--exclude=*.dump"
      - "--exclude=TestResults"
      # Config Alertmanager générée sur l'hôte depuis le vault (secrets) : ne pas
      # la supprimer lors de la synchro (elle n'existe pas dans le dépôt).
      - "--exclude=alertmanager.yml"
  when: not skip_sync
  # Le sync pousse aussi deploy/monitoring/ (conf montée dans les conteneurs) :
  # accessible via --tags monitoring pour ne PAS rebuild l'app.
  tags: [deploy, monitoring]

- name: Générer le fichier d'environnement ({{ target_env }})
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/deploy/.env.{{ target_env }}"
    mode: "0600"

# --- Push FCM : compte de service Firebase (secret Vault -> fichier monté) ---
#
# Deux façons de fournir le secret dans le vault, par ordre de préférence :
#   1. fcm_service_account_b64 : le JSON encodé en base64 sur UNE seule ligne.
#      FORTEMENT recommandé — insensible à l'indentation YAML. Le JSON du compte
#      de service est multi-lignes (clé privée), et un bloc littéral « | » casse
#      dès qu'une ligne se retrouve mal indentée au copier-coller (« did not find
#      expected key »). Le base64 supprime ce piège entièrement.
#      Générer :  base64 -w0 service-account.json      (Linux)
#                 base64 -i service-account.json | tr -d '\n'   (macOS)
#   2. fcm_service_account_json : le JSON brut (bloc « | »). Repli de compat ;
#      ne l'utiliser que si l'indentation est parfaitement maîtrisée.
- name: Résoudre le compte de service FCM (base64 prioritaire, JSON brut en repli)
  ansible.builtin.set_fact:
    fcm_service_account_resolved: >-
      {{ (fcm_service_account_b64 | b64decode)
         if (fcm_service_account_b64 | default('') | trim | length > 0)
         else (fcm_service_account_json | default('')) }}
  no_log: true

- name: Créer le répertoire du compte de service FCM
  ansible.builtin.file:
    path: "{{ app_dir }}/deploy/fcm"
    state: directory
    mode: "0700"
  when: fcm_service_account_resolved | default('') | trim | length > 0

- name: Écrire le JSON du compte de service FCM (push)
  ansible.builtin.copy:
    content: "{{ fcm_service_account_resolved }}"
    dest: "{{ app_dir }}/deploy/fcm/service-account.json"
    mode: "0600"
  no_log: true
  when: fcm_service_account_resolved | default('') | trim | length > 0

# --- MODE REGISTRY (use_registry=true) : le serveur ne compile PAS, il PULL ---
- name: Connexion au registry (images privées)
  ansible.builtin.command:
    cmd: "docker login {{ registry_host | default('ghcr.io') }} -u {{ registry_username }} --password-stdin"
    stdin: "{{ registry_token }}"
  no_log: true
  changed_when: false
  when:
    - use_registry | default(false)
    - registry_username is defined
    - registry_token is defined

# ═══════════════════════════════════════════════════════════════════════════════
# DEUX PULLS, DEUX NIVEAUX D'EXIGENCE.
#
# Un `pull` global tirait aussi `console` et `seller-console`, construites par un
# AUTRE dépôt. Une seule de ces deux images manquante — « failed to resolve
# reference » — et les six images backend, pourtant publiées, ne se déployaient
# pas. Voir registry_pull_required / registry_pull_optional dans defaults/main.yml.
#
# `postgres` n'est nommé nulle part À DESSEIN : il porte `profiles: [local-db]` et
# c'est COMPOSE_PROFILES, dans .env.{{ target_env }}, qui décide de son existence.
# Le nommer ici l'activerait de force et ressusciterait la base locale le jour de
# la bascule vers le VPS base.
# ═══════════════════════════════════════════════════════════════════════════════
- name: Récupérer les images de ce dépôt (échec bloquant)
  ansible.builtin.command:
    cmd: >-
      docker compose -f deploy/{{ compose_file }}
      --env-file deploy/.env.{{ target_env }}
      pull {{ registry_pull_required | join(' ') }}
    chdir: "{{ app_dir }}"
  register: compose_pull
  changed_when: true
  when: use_registry | default(false)

- name: Récupérer les images des consoles (dépôt séparé, échec toléré)
  ansible.builtin.command:
    cmd: >-
      docker compose -f deploy/{{ compose_file }}
      --env-file deploy/.env.{{ target_env }}
      pull {{ registry_pull_optional | join(' ') }}
    chdir: "{{ app_dir }}"
  register: compose_pull_optional
  changed_when: true
  failed_when: false
  when:
    - use_registry | default(false)
    - registry_pull_optional | length > 0

# Une image de console peut être absente du registry ET absente du disque : la
# nommer dans le `up` ferait échouer le démarrage de TOUTE la pile. On construit
# donc la liste des services réellement démarrables. `config --services` respecte
# COMPOSE_PROFILES, donc `postgres` y figure exactement quand il doit y figurer.
- name: Déterminer les services démarrables (consoles absentes exclues)
  ansible.builtin.shell:
    cmd: |
      set -eu
      COMPOSE="docker compose -f deploy/{{ compose_file }} --env-file deploy/.env.{{ target_env }}"
      OPTIONNELS="{{ registry_pull_optional | join(' ') }}"
      DEMARRABLES=""
      for svc in $($COMPOSE config --services); do
        case " $OPTIONNELS " in
          *" $svc "*)
            image=$($COMPOSE config --format json 2>/dev/null \
              | python3 -c "import sys,json;print(json.load(sys.stdin)['services']['$svc'].get('image',''))" || echo "")
            if [ -n "$image" ] && ! docker image inspect "$image" >/dev/null 2>&1; then
              echo "IMAGE ABSENTE, SERVICE IGNORE : $svc ($image)" >&2
              continue
            fi
            ;;
        esac
        DEMARRABLES="$DEMARRABLES $svc"
      done
      echo $DEMARRABLES
    chdir: "{{ app_dir }}"
  register: compose_services_demarrables
  changed_when: false
  when: use_registry | default(false)

- name: Signaler les consoles non déployées
  ansible.builtin.debug:
    msg: >-
      Consoles non déployées (image ni dans le registry ni sur l'hôte) :
      {{ registry_pull_optional | difference((compose_services_demarrables.stdout | default('')).split()) | join(', ') }}.
      Publier ces images depuis leur dépôt, puis relancer ce playbook.
  when:
    - use_registry | default(false)
    - registry_pull_optional | difference((compose_services_demarrables.stdout | default('')).split()) | length > 0

# --- MODE BUILD (défaut) : compilation SÉQUENTIELLE sur l'hôte (RAM) ---
- name: Construire les images (séquentiel)
  ansible.builtin.command:
    cmd: "docker compose -f deploy/{{ compose_file }} --env-file deploy/.env.{{ target_env }} build"
    chdir: "{{ app_dir }}"
  environment:
    DOCKER_BUILDKIT: "1"
    COMPOSE_PARALLEL_LIMIT: "1"
  register: compose_build_res
  changed_when: true
  when:
    - compose_build | default(true)
    - not (use_registry | default(false))

# `--remove-orphans` ne retire QUE les conteneurs dont le service a disparu du
# fichier compose. Les services présents mais non nommés ici — une console dont
# l'image n'a pas encore été publiée — restent en place, ils ne sont pas arrêtés.
- name: Démarrer la stack (docker compose up, sans build)
  ansible.builtin.command:
    cmd: >-
      docker compose -f deploy/{{ compose_file }}
      --env-file deploy/.env.{{ target_env }}
      up -d --no-build --remove-orphans
      {{ compose_services_demarrables.stdout | default('') if (use_registry | default(false)) else '' }}
    chdir: "{{ app_dir }}"
  register: compose_up
  changed_when: true

# La config STATIQUE de Traefik (traefik.<env>.yml : entrypoints, metrics :8082) n'est
# relue qu'à la RECRÉATION du conteneur — un « up -d » ne suffit pas quand seul le
# fichier bind-monté a changé. On recrée donc Traefik explicitement, sinon les
# métriques Prometheus (dashboard Traefik) restent à « No data ».
- name: Recréer Traefik (recharge sa config statique — metrics, entrypoints)
  ansible.builtin.command:
    cmd: "docker compose -f deploy/{{ compose_file }} --env-file deploy/.env.{{ target_env }} up -d --no-build --force-recreate traefik"
    chdir: "{{ app_dir }}"
  changed_when: true

- name: Statut des conteneurs
  ansible.builtin.command:
    cmd: "docker compose -f deploy/{{ compose_file }} --env-file deploy/.env.{{ target_env }} ps"
    chdir: "{{ app_dir }}"
  register: compose_ps
  changed_when: false

- name: Afficher le statut
  ansible.builtin.debug:
    var: compose_ps.stdout_lines

# --- PostgreSQL co-hébergé : pg_stat_statements (requêtes lentes) ------------
# Le préchargement (shared_preload_libraries) n'est actif qu'au (re)démarrage du
# conteneur ; un « up -d » ne recrée pas postgres sur simple changement de conf
# montée. On le redémarre puis on crée l'extension (idempotent). Sans base locale
# (Neon externe), tout ce bloc est sauté.
# ═══════════════════════════════════════════════════════════════════════════════
# pg_stat_statements SUR LE POSTGRES CO-HÉBERGÉ, ET SEULEMENT SUR LUI.
#
# Deux corrections par rapport à la version précédente.
#
# 1. LA CONDITION. Elle ne portait que sur `postgres_password is defined`, qui reste
#    vrai après la bascule : le bloc aurait continué de faire `docker compose exec
#    postgres` sur une machine où ce conteneur n'existe plus. Sur le VPS base, c'est
#    le rôle `postgres_host` qui s'en charge, par sa configuration.
#
# 2. L'ORDRE. L'attente venait APRÈS le test. Si le `psql` tombait pendant que
#    Postgres finissait de démarrer, sa sortie était vide, `'pg_stat_statements' not
#    in ''` était VRAI, et Ansible redémarrait Postgres — sous les pieds d'une API
#    qui appliquait ses vingt-six migrations. Une base tuée en cours de migration,
#    sans sauvegarde, était le pire état atteignable par cette chaîne.
#
#    L'attente passe donc en premier, et le test devient bloquant en cas d'échec :
#    « je n'ai pas pu lire » n'est plus traité comme « ce n'est pas configuré ».
# ═══════════════════════════════════════════════════════════════════════════════
- name: Activer pg_stat_statements (Postgres co-hébergé)
  when:
    - postgres_password is defined
    - not (use_external_database | default(false))
  block:
    - name: Attendre que Postgres réponde AVANT de l'interroger
      ansible.builtin.command:
        cmd: "docker compose -f deploy/{{ compose_file }} --env-file deploy/.env.{{ target_env }} exec -T postgres pg_isready -U {{ postgres_user | default('postgres') }}"
        chdir: "{{ app_dir }}"
      register: pg_ready
      retries: 12
      delay: 5
      until: pg_ready.rc == 0
      changed_when: false

    - name: Vérifier si pg_stat_statements est déjà préchargé
      ansible.builtin.command:
        cmd: >-
          docker compose -f deploy/{{ compose_file }} --env-file deploy/.env.{{ target_env }}
          exec -T postgres psql -U {{ postgres_user | default('postgres') }} -tAc "SHOW shared_preload_libraries;"
        chdir: "{{ app_dir }}"
      register: pg_preload
      changed_when: false

    - name: Redémarrer postgres pour charger shared_preload_libraries (si nécessaire)
      ansible.builtin.command:
        cmd: "docker compose -f deploy/{{ compose_file }} --env-file deploy/.env.{{ target_env }} restart postgres"
        chdir: "{{ app_dir }}"
      when: "'pg_stat_statements' not in pg_preload.stdout"
      changed_when: true

    - name: Réattendre après le redémarrage
      ansible.builtin.command:
        cmd: "docker compose -f deploy/{{ compose_file }} --env-file deploy/.env.{{ target_env }} exec -T postgres pg_isready -U {{ postgres_user | default('postgres') }}"
        chdir: "{{ app_dir }}"
      register: pg_ready_apres
      retries: 12
      delay: 5
      until: pg_ready_apres.rc == 0
      changed_when: false

    - name: Créer l'extension pg_stat_statements
      ansible.builtin.command:
        cmd: >-
          docker compose -f deploy/{{ compose_file }} --env-file deploy/.env.{{ target_env }}
          exec -T postgres psql -U {{ postgres_user | default('postgres') }} -d {{ postgres_db | default('marketplace') }}
          -c "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"
        chdir: "{{ app_dir }}"
      register: pg_ext
      changed_when: "'CREATE EXTENSION' in pg_ext.stdout"
