---
- name: Générer le fichier d'environnement ({{ target_env }})
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_dir }}/deploy/.env.{{ target_env }}"
    mode: "0600"

# Compte de service Firebase (push). Deux formes acceptées dans le vault :
#   fcm_service_account_b64  — le JSON en base64 sur une ligne. À PRÉFÉRER :
#                              insensible à l'indentation YAML.
#                              base64 -w0 service-account.json        (Linux)
#                              base64 -i service-account.json | tr -d '\n'   (macOS)
#   fcm_service_account_json — le JSON brut en bloc « | ». Casse dès qu'une ligne
#                              est mal indentée au copier-coller.
- name: Résoudre le compte de service FCM (base64 prioritaire)
  ansible.builtin.set_fact:
    fcm_service_account_resolved: >-
      {{ (fcm_service_account_b64 | b64decode)
         if (fcm_service_account_b64 | default('') | trim | length > 0)
         else (fcm_service_account_json | default('')) }}
  no_log: true

- name: Écrire le compte de service FCM
  when: fcm_service_account_resolved | default('') | trim | length > 0
  block:
    - name: Créer le répertoire du compte de service FCM
      ansible.builtin.file:
        path: "{{ app_dir }}/deploy/fcm"
        state: directory
        mode: "0700"

    - name: Écrire le JSON du compte de service FCM
      ansible.builtin.copy:
        content: "{{ fcm_service_account_resolved }}"
        dest: "{{ app_dir }}/deploy/fcm/service-account.json"
        mode: "0600"
      no_log: true
