---
# Répertoire de l'application sur l'hôte cible.
app_dir: /opt/marketplace
# Fichier compose à utiliser (surchargé par environnement).
compose_file: docker-compose.yml
# Nom de projet Compose, tel que le déclare l'en-tête `name:` du fichier compose.
compose_project: "marketplace-{{ target_env }}"
# Reconstruire les images sur l'hôte (ignoré quand use_registry est vrai).
compose_build: true

# Images publiées par CE dépôt, donc à tirer explicitement. Il n'y en a qu'une :
# deploy/build-and-push.sh pousse `api` et rien d'autre. Redis, rembg, Traefik et
# Postgres viennent de registres publics, `up` les tire lui-même.
registry_images:
  - api

# Services que ce dépôt démarre. Les trois applications Next (console,
# seller-console, site) viennent du dépôt web : elles restent DÉCLARÉES dans le
# compose — les en retirer les ferait supprimer par `--remove-orphans` — mais
# Ansible ne les tire pas, ne les démarre pas et ne les arrête pas.
#
# Staging ajoute `postgres` et `traefik`, qu'il héberge ; la production ne les a pas
# (base sur le VPS dédié, reverse proxy installé à part sur le réseau `proxy`).
backend_services:
  - api
  - redis
  - rembg

# REDIS. Par défaut, celui du compose de l'environnement (staging) : le service
# s'appelle `redis` sur le réseau interne de la pile.
#
# `use_external_redis` dit que le Redis vit AILLEURS — en production, un conteneur du
# VPS sur un réseau Docker partagé. Il faut alors `redis_host` (son nom de service) et
# `redis_network` (le réseau à déclarer en externe), et le compose de l'environnement
# ne doit plus déclarer de service `redis`.
use_external_redis: false
redis_host: redis
redis_port: 6379
# Préfixe des clés, décisif sur un Redis PARTAGÉ.
redis_instance_name: "marketplace:"

# Vérification après déploiement : readiness interne + routage public.
enable_post_deploy_check: true
post_deploy_health_services:
  - api
post_deploy_health_path: /health/ready
post_deploy_health_retries: 10
post_deploy_health_delay: 15
# VIDE par défaut : ces URL se construisent sur `root_domain`, que seuls prod et
# staging définissent. Chaque inventaire déclare la sienne.
post_deploy_public_urls: []
