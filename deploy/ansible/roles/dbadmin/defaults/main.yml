---
# Sous-domaine de l'admin base de données (ex. db.<root_domain>).
db_admin_subdomain: "db"

# Image pgweb épinglée.
dbadmin_image: "sosedoff/pgweb:0.16.2"

# Base cible (co-hébergée dans le conteneur `postgres`, même réseau).
# Hôte de la base. `postgres` = le conteneur local ; l'adresse du tunnel dès que la
# base a sa propre machine. Le group_vars de prod le surcharge via
# `use_external_database` — voir inventories/prod/group_vars/marketplace/main.yml.
db_admin_pg_host: "{{ wg_db_ip if (use_external_database | default(false)) else 'postgres' }}"
db_admin_pg_port: "5432"
db_admin_pg_user: "readonly"
# ═══════════════════════════════════════════════════════════════════════════════════
# LE NOM DE LA BASE SUIT L'HÔTE, SINON PGWEB VISE UNE BASE QUI N'EXISTE PAS.
#
# `db_admin_pg_host` juste au-dessus bascule bien vers le VPS base quand celle-ci a sa
# propre machine — mais le NOM de la base, lui, restait `postgres_db`, c'est-à-dire
# `marketplace` : le nom de la base du CONTENEUR local. Or `postgres_db` n'est même pas
# défini dans les group_vars de production, et la base réelle s'appelle `HbaExpressDb`.
#
# Résultat : pgweb se connectait au bon serveur, avec le bon utilisateur, sur une base
# inexistante — et l'erreur (« database "marketplace" does not exist ») laisse croire à
# un problème de droits ou de tunnel, c'est-à-dire exactement là où on ne cherchera pas.
#
# Même famille de défaut que le `DISPATCH_CONNECTION` qui visait `postgres_user` : une
# moitié de la configuration suit la bascule, l'autre non.
# ═══════════════════════════════════════════════════════════════════════════════════
db_admin_pg_db: >-
  {{ app_db_name if (use_external_database | default(false))
     else (postgres_db | default('marketplace')) }}

# ── VERROUS (à définir dans le vault pour que l'admin BD soit joignable) ───────
# Mot de passe de l'utilisateur PostgreSQL `readonly` (créé par ce rôle).
db_admin_readonly_password: ""
# Liste blanche d'IP autorisées (CIDR). VIDE = Traefik REFUSE tout le monde.
db_admin_allowed_ips: []
# Utilisateurs d'auth HTTP au format htpasswd (bcrypt/apr1). VIDE = REFUSE tout.
#   Générer :  htpasswd -nbB admin 'MotDePasseFort'
db_admin_basic_auth_users: []
