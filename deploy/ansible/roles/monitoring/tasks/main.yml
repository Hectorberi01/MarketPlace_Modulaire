---
# Stack d'observabilité (deploy/monitoring/) : OpenTelemetry Collector, Prometheus,
# Tempo, Loki + Promtail, Grafana (exposé via Traefik/TLS), Uptime Kuma.
#
# Pré-requis : la stack applicative doit être UP (le réseau externe partagé
# « {{ app_network }} » est créé par elle). Le rôle « marketplace » synchronise
# déjà deploy/monitoring/ sur l'hôte et démarre l'app AVANT ce rôle.
#
# Idempotent (docker compose up -d). Gated par enable_monitoring.

# ═══════════════════════════════════════════════════════════════════════════════
# UN CANAL À MOITIÉ CONFIGURÉ EST PIRE QU'UN CANAL ABSENT.
#
# Le vault d'exemple livre `alertmanager_slack_webhook_url` à « .../CHANGE/ME » et
# `smtp_password` à « CHANGE_ME ». Ces valeurs sont NON VIDES : l'ancien gabarit les
# prenait pour de vraies coordonnées, rendait un receiver complet, et Alertmanager
# échouait à chaque envoi — dans ses propres logs, que personne ne lit, puisque
# justement personne n'est prévenu.
#
# On calcule donc l'activité de chaque canal ici, gabarits exclus, et le rendu s'y
# réfère. `no_log` parce que ces expressions touchent le webhook et le mot de passe.
# ═══════════════════════════════════════════════════════════════════════════════
- name: Déterminer quels canaux d'alerte sont réellement configurés
  ansible.builtin.set_fact:
    alert_slack_actif: >-
      {{ (alertmanager_slack_webhook_url | default('') | trim | length > 0)
         and ('CHANGE' not in (alertmanager_slack_webhook_url | default(''))) }}
    alert_email_actif: >-
      {{ (smtp_host | default('') | trim | length > 0)
         and (alert_email_to | default('') | trim | length > 0)
         and (smtp_password | default('') | trim | length > 0)
         and ('CHANGE_ME' not in (smtp_password | default(''))) }}
  no_log: true

- name: Exiger au moins un canal d'alerte joignable
  ansible.builtin.assert:
    that:
      - (alert_slack_actif | bool) or (alert_email_actif | bool)
    fail_msg: >-
      Aucun canal d'alerte n'est configuré : Alertmanager rendrait des receivers vides
      et abandonnerait chaque notification en silence. Renseigner, dans le vault de
      {{ target_env }}, SOIT alertmanager_slack_webhook_url (webhook Slack réel), SOIT
      le trio smtp_host / alert_email_to / smtp_password. Les valeurs d'exemple
      contenant « CHANGE » ne comptent pas.
    success_msg: >-
      Canaux d'alerte actifs — Slack : {{ alert_slack_actif }}, e-mail : {{ alert_email_actif }}.

- name: Générer le .env de la stack monitoring
  ansible.builtin.template:
    src: monitoring.env.j2
    dest: "{{ app_dir }}/deploy/monitoring/.env"
    mode: "0600"

# Config Alertmanager rendue depuis le vault (webhook Slack + SMTP). Contient des
# secrets → jamais committée (exclue de la synchro Git), régénérée à chaque run.
- name: Générer la config Alertmanager (secrets vault)
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ app_dir }}/deploy/monitoring/alertmanager.yml"
    # Propriétaire = le compte du conteneur, pas root. Voir defaults/main.yml :
    # en 0600 root:root, l'image (qui tourne en `nobody`) ne peut pas lire sa
    # propre configuration.
    owner: "{{ alertmanager_run_uid }}"
    group: "{{ alertmanager_run_uid }}"
    mode: "0600"

# Une configuration invalide fait redémarrer Alertmanager en boucle : le conteneur
# est « restarting », les alertes ne partent plus, et le playbook se terminait en
# succès. `amtool check-config` la relit avec le même analyseur que le service, dans
# la même version d'image — on échoue ici plutôt qu'en production silencieuse.
- name: Valider la configuration Alertmanager rendue
  ansible.builtin.command:
    cmd: >-
      docker run --rm --entrypoint amtool --user {{ alertmanager_run_uid }}
      -v {{ app_dir }}/deploy/monitoring/alertmanager.yml:/tmp/alertmanager.yml:ro
      {{ alertmanager_image }}
      check-config /tmp/alertmanager.yml
  register: alertmanager_check
  changed_when: false

- name: Démarrer la stack de monitoring (docker compose up -d)
  ansible.builtin.command:
    cmd: "docker compose -f docker-compose.monitoring.yml --env-file .env up -d --remove-orphans"
    chdir: "{{ app_dir }}/deploy/monitoring"
  register: monitoring_up
  changed_when: true

# Les fichiers de config montés (prometheus.yml, promtail-config.yaml, provisioning
# Grafana) ne sont relus qu'au démarrage : un « up -d » ne les recharge pas si la
# définition du service est inchangée. On redémarre les services concernés.
- name: Recharger la config (Prometheus + Collector + Promtail + Alertmanager + Grafana)
  ansible.builtin.command:
    cmd: "docker compose -f docker-compose.monitoring.yml restart otel-collector prometheus promtail alertmanager grafana postgres-exporter"
    chdir: "{{ app_dir }}/deploy/monitoring"
  changed_when: true

- name: Statut des conteneurs de monitoring
  ansible.builtin.command:
    cmd: "docker compose -f docker-compose.monitoring.yml ps"
    chdir: "{{ app_dir }}/deploy/monitoring"
  register: monitoring_ps
  changed_when: false

- name: Afficher le statut du monitoring
  ansible.builtin.debug:
    var: monitoring_ps.stdout_lines
