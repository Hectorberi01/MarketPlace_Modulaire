---
# ═════════════════════════════════════════════════════════════════════════════════
# PLAYBOOK PRINCIPAL — DEUX JEUX DE RÔLES, POUR DEUX MACHINES.
#
#   ansible-playbook -i inventories/prod/hosts.ini    site.yml --ask-vault-pass
#   ansible-playbook -i inventories/staging/hosts.ini site.yml --ask-vault-pass
#   ansible-playbook -i inventories/dev/hosts.ini     site.yml
#
# Ne relancer que le déploiement applicatif :
#   ansible-playbook -i inventories/prod/hosts.ini site.yml --tags deploy --ask-vault-pass
#
# Ne toucher qu'au VPS base :
#   ansible-playbook -i inventories/prod/hosts.ini site.yml --limit database --ask-vault-pass
#
# ─────────────────────────────────────────────────────────────────────────────────
# L'ORDRE DES DEUX PLAYS N'EST PAS ARBITRAIRE.
#
# La base d'abord. L'application ne peut pas démarrer sans elle, et la première
# chose que fait l'API au démarrage est d'appliquer ses vingt-six migrations. Un
# ordre inverse donnerait, à chaque première installation, une pile applicative qui
# boucle en attendant une base qu'Ansible n'a pas encore configurée.
#
# Le tunnel avant tout, des deux côtés : c'est le seul chemin entre les machines.
# ═════════════════════════════════════════════════════════════════════════════════

- name: Tunnel privé entre les machines ({{ target_env | default('?') }})
  hosts: marketplace,database
  become: true
  roles:
    - role: wireguard
      tags: [wireguard, setup]
      when: enable_wireguard | default(false)

- name: Base de données ({{ target_env | default('?') }})
  hosts: database
  become: true
  roles:
    - role: security
      tags: [security]
      when: enable_security | default(false)
    - role: postgres_host
      tags: [database, postgres]
    - role: minio
      tags: [minio, storage]
      when: enable_minio | default(false)
    - role: backup
      tags: [backup]
      when: enable_backup | default(false)

- name: Application ({{ target_env | default('?') }})
  hosts: marketplace
  become: true
  vars:
    # Racine du dépôt sur la machine de contrôle (deploy/ansible -> repo).
    project_local_path: "{{ playbook_dir | dirname | dirname }}"
  roles:
    - role: docker
      tags: [docker, setup]
      when: manage_docker | default(true)
    - role: security
      tags: [security]
      when: enable_security | default(false)
    - role: marketplace
      tags: [deploy]
    - role: monitoring
      tags: [monitoring]
      when: enable_monitoring | default(false)
    - role: portainer
      tags: [portainer]
      when: enable_portainer | default(true)
    - role: webterminal
      tags: [webterminal]
      when: enable_web_terminal | default(false)
    - role: dbadmin
      tags: [dbadmin]
      when: enable_db_admin | default(false)
