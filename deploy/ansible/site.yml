---
# ═════════════════════════════════════════════════════════════════════════════════
# PLAYBOOK PRINCIPAL — DEUX JEUX DE RÔLES, POUR DEUX MACHINES.
#
#   ansible-playbook -i inventories/prod/hosts.ini    site.yml --ask-vault-pass
#   ansible-playbook -i inventories/staging/hosts.ini site.yml --ask-vault-pass
#   ansible-playbook -i inventories/dev/hosts.ini     site.yml
#
# Ne relancer que le déploiement applicatif :
#   ansible-playbook -i inventories/prod/hosts.ini site.yml --tags deploy --ask-vault-pass
#
# Ne toucher qu'au VPS base :
#   ansible-playbook -i inventories/prod/hosts.ini site.yml --limit database --ask-vault-pass
#
# ─────────────────────────────────────────────────────────────────────────────────
# L'ORDRE DES DEUX PLAYS N'EST PAS ARBITRAIRE.
#
# La base d'abord. L'application ne peut pas démarrer sans elle, et la première
# chose que fait l'API au démarrage est d'appliquer ses vingt-six migrations. Un
# ordre inverse donnerait, à chaque première installation, une pile applicative qui
# boucle en attendant une base qu'Ansible n'a pas encore configurée.
#
# Le tunnel avant tout, des deux côtés : c'est le seul chemin entre les machines.
# ═════════════════════════════════════════════════════════════════════════════════

- name: Tunnel privé entre les machines ({{ target_env | default('?') }})
  hosts: marketplace,database
  become: true
  roles:
    - role: wireguard
      tags: [wireguard, setup]
      when: enable_wireguard | default(false)

- name: Base de données ({{ target_env | default('?') }})
  hosts: database
  become: true
  roles:
    - role: security
      tags: [security]
      when: enable_security | default(false)
    - role: postgres_host
      tags: [database, postgres]
    - role: minio
      tags: [minio, storage]
      when: enable_minio | default(false)
    - role: backup
      tags: [backup]
      when: enable_backup | default(false)

- name: Application ({{ target_env | default('?') }})
  hosts: marketplace
  become: true
  vars:
    # Racine du dépôt sur la machine de contrôle (deploy/ansible -> repo).
    project_local_path: "{{ playbook_dir | dirname | dirname }}"
  # ═══════════════════════════════════════════════════════════════════════════════
  # CE QUI PEUT ÊTRE REFUSÉ D'AVANCE DOIT L'ÊTRE AVANT D'AVOIR RIEN DÉPLOYÉ.
  #
  # La vérification du canal d'alerte vit dans le rôle `monitoring`, qui tourne APRÈS
  # `marketplace`. Un vault sans destinataire faisait donc échouer le playbook une
  # fois l'application déjà remplacée, et privait au passage `portainer`,
  # `webterminal` et `dbadmin` de leur exécution. Le même contrôle, ici, coûte deux
  # secondes et ne laisse pas la production à moitié déployée.
  # ═══════════════════════════════════════════════════════════════════════════════
  pre_tasks:
    - name: Exiger un canal d'alerte AVANT tout déploiement
      ansible.builtin.assert:
        that:
          - (alertmanager_slack_webhook_url | default('') | trim | length > 0
             and 'CHANGE' not in (alertmanager_slack_webhook_url | default('')))
            or (smtp_host | default('') | trim | length > 0
                and alert_email_to | default('') | trim | length > 0
                and smtp_password | default('') | trim | length > 0
                and 'CHANGE_ME' not in (smtp_password | default('')))
        fail_msg: >-
          Aucun canal d'alerte joignable pour {{ target_env | default('?') }}.
          Alertmanager rendrait des receivers vides et abandonnerait chaque notification
          en silence. Renseigner dans le vault SOIT alertmanager_slack_webhook_url,
          SOIT smtp_password (avec smtp_host et alert_email_to dans group_vars).
          Les valeurs d'exemple contenant « CHANGE » ne comptent pas.
        quiet: true
      # PAS de `no_log` ici : il masquerait le `fail_msg`, c'est-à-dire la seule chose
      # utile de cette tâche. `assert` n'affiche que le TEXTE de l'expression, jamais la
      # valeur des variables — le webhook et le mot de passe ne sortent pas.
      when: enable_monitoring | default(false)
      tags: [always]
  roles:
    - role: docker
      tags: [docker, setup]
      when: manage_docker | default(true)
    - role: security
      tags: [security]
      when: enable_security | default(false)
    - role: marketplace
      tags: [deploy]
    - role: monitoring
      tags: [monitoring]
      when: enable_monitoring | default(false)
    - role: portainer
      tags: [portainer]
      when: enable_portainer | default(true)
    - role: webterminal
      tags: [webterminal]
      when: enable_web_terminal | default(false)
    - role: dbadmin
      tags: [dbadmin]
      when: enable_db_admin | default(false)
