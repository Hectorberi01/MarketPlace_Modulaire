# =====================================================================
#  PostgreSQL 16 — Marketplace STAGING (base CO-HÉBERGÉE sur le VPS)
#
#  Cible : petit VPS ~4 Go RAM PARTAGÉ avec l'API + 5 BFF + Redis + Traefik +
#  console. Postgres ne reçoit donc qu'un budget modeste (~512 Mo) : surtout NE
#  PAS réutiliser la conf de prod (shared_buffers 4 Go) qui ferait planter la
#  machine. Réglages volontairement prudents ; le staging ne porte pas de charge.
#
#  Monté en lecture seule et chargé via `-c config_file=` (voir compose staging).
# =====================================================================

# --- Réseau : joignable par l'API/les BFF sur le réseau Docker uniquement
#     (aucun `ports:` publié vers Internet dans le compose). ---
listen_addresses = '*'
max_connections = 100                 # staging : charge faible ; limiter aussi côté Npgsql (Maximum Pool Size)
password_encryption = scram-sha-256

# --- Extensions préchargées ------------------------------------------------
# pg_stat_statements : suivi des requêtes (temps moyen, appels) → requêtes lentes.
# Nécessite un préchargement au démarrage + CREATE EXTENSION (fait par Ansible).
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top

# --- Mémoire (budget ~512 Mo pour Postgres sur une machine partagée) --------
shared_buffers = 256MB
effective_cache_size = 1GB            # simple indice au planificateur (cache OS)
maintenance_work_mem = 128MB          # index / VACUUM / migrations
work_mem = 8MB
huge_pages = off

# --- Disque NVMe ------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- WAL / points de contrôle / durabilité ---------------------------------
wal_level = replica
synchronous_commit = on               # ce sont des paiements : on ne relâche pas
wal_buffers = 16MB
min_wal_size = 256MB
max_wal_size = 1GB
checkpoint_completion_target = 0.9
wal_compression = on

# --- Parallélisme (petit gabarit) ------------------------------------------
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# --- Autovacuum -------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 2
autovacuum_naptime = 30s

# --- Journalisation ---------------------------------------------------------
log_min_duration_statement = 1000ms   # requêtes > 1 s
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# --- Divers -----------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
default_statistics_target = 100
