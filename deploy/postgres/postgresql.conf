# =====================================================================
#  PostgreSQL 16 — Marketplace (base CO-HÉBERGÉE sur le VPS)
#
#  Cible : VPS 8 vCore / 24 Go RAM / NVMe, base PARTAGÉE avec 5 hôtes .NET
#  + Redis. On ne donne donc PAS toute la RAM à Postgres : ~8 Go de budget
#  (shared_buffers 4 Go + marge), le reste va aux apps et au cache OS.
#
#  Monté en lecture seule et chargé via `-c config_file=` (voir compose).
#  Ajuster shared_buffers/effective_cache_size si tu changes de gabarit.
# =====================================================================

# --- Réseau : indispensable pour que l'API et les BFF (autres conteneurs)
#     puissent se connecter sur le réseau Docker. Le port n'est PAS publié
#     vers Internet (aucun `ports:` dans le compose).
listen_addresses = '*'
max_connections = 200                 # 5 hôtes × pools Npgsql. Limiter aussi côté client (Maximum Pool Size).
password_encryption = scram-sha-256

# --- Extensions préchargées ------------------------------------------------
# pg_stat_statements : suivi des requêtes (temps moyen, appels) → requêtes lentes.
# Préchargement au démarrage requis + CREATE EXTENSION (fait par Ansible).
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top

# --- Mémoire ---------------------------------------------------------------
shared_buffers = 4GB                  # ~25 % du budget alloué à Postgres
effective_cache_size = 12GB           # indice au planificateur (cache OS partagé de la machine)
maintenance_work_mem = 512MB          # index / VACUUM / migrations
work_mem = 10MB                       # par nœud de tri ; prudent car max_connections élevé
huge_pages = try

# --- Disque NVMe : le hasard coûte presque autant que le séquentiel --------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- WAL / points de contrôle / durabilité ---------------------------------
wal_level = replica                   # autorise l'archivage WAL / PITR si tu l'actives plus tard
synchronous_commit = on               # ne pas relâcher : ce sont des paiements
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9
wal_compression = on

# --- Parallélisme (8 vCore, mais partagés avec les apps) -------------------
max_worker_processes = 8
max_parallel_workers = 6
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- Autovacuum : garder les stats fraîches sous charge --------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# --- Journalisation utile en prod (sans noyer le disque) -------------------
log_min_duration_statement = 500ms    # trace les requêtes lentes (> 0,5 s)
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

# --- Divers ----------------------------------------------------------------
timezone = 'UTC'
datestyle = 'iso, mdy'
default_statistics_target = 100
