# =====================================================================
#  STAGING — Marketplace
#  Identique à la prod, avec les ajustements de pré-production :
#   • ACME Let's Encrypt STAGING par défaut (certificats non fiables mais SANS
#     rate-limit) — bascule vers l'ACME prod via ACME_CASERVER quand tu es prêt.
#   • ASPNETCORE_ENVIRONMENT=Staging (Swagger activé, logs plus verbeux).
#   • Base et secrets DÉDIÉS au staging (branche Neon de staging, clés FedaPay
#     sandbox) — jamais les données/clés de prod.
#   • Réseau, volumes et nom de projet ISOLÉS (peut cohabiter avec la prod si les
#     ports Traefik sont changés via TRAEFIK_HTTP_PORT / TRAEFIK_HTTPS_PORT).
#
#  Lancement :
#     cd deploy
#     cp .env.staging.example .env.staging   # renseigner les valeurs
#     docker compose -f docker-compose.staging.yml --env-file .env.staging up -d --build
# =====================================================================

name: marketplace-staging

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  ASPNETCORE_ENVIRONMENT: "Staging"
  # Observabilité : export OTLP (traces + métriques) vers le collector. Vide = pas
  # d'export (l'app tourne normalement). Ex. : http://otel-collector:4317
  Otel__Endpoint: "${OTEL_ENDPOINT:-}"
  # Base DÉDIÉE au staging (branche Neon de staging). Endpoint DIRECT (sans -pooler).
  ConnectionStrings__Marketplace: "${MARKETPLACE_CONNECTION:?MARKETPLACE_CONNECTION requis (chaine Npgsql Neon staging)}"
  Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD requis},abortConnect=false"
  Jwt__Issuer: "marketplace"
  Jwt__Audience: "marketplace"
  Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY requis}"
  # Validation des comptes par un administrateur.
  #
  # « true » = tout compte issu de l'inscription publique reste bloqué tant qu'un
  # administrateur ne l'a pas validé dans la console. C'est le réglage actuel, et
  # il a un coût réel : un acheteur qui s'inscrit la nuit ne peut rien commander
  # avant d'être validé. Le jour où le volume rendra la file intenable, basculer
  # REQUIRE_APPROVAL_BUYERS à « false » suffit — sans livraison de code.
  #
  # Les comptes créés DEPUIS la console restent actifs d'emblée : c'est
  # l'administrateur qui vient de les créer, l'auto-validation n'apporterait rien.
  Identity__Registration__RequireApprovalForBuyers: "${REQUIRE_APPROVAL_BUYERS:-true}"
  Identity__Registration__RequireApprovalForAdminCreated: "${REQUIRE_APPROVAL_ADMIN_CREATED:-false}"
  # Amorçage du PREMIER administrateur (idempotent : ne réinitialise jamais un
  # compte existant). Créé au démarrage de l'api UNIQUEMENT si les deux valeurs
  # sont renseignées : admin_email (group_vars) + admin_password (vault). Vides =
  # aucun admin créé — c'était le cas jusqu'ici en staging.
  Identity__Bootstrap__AdminEmail: "${ADMIN_EMAIL:-}"
  Identity__Bootstrap__AdminPassword: "${ADMIN_PASSWORD:-}"
  Identity__Bootstrap__AdminFirstName: "${ADMIN_FIRST_NAME:-Admin}"
  Identity__Bootstrap__AdminLastName: "${ADMIN_LAST_NAME:-Plateforme}"
  Identity__Bootstrap__AdminPhone: "${ADMIN_PHONE:-+22900000000}"
  # FedaPay SANDBOX en staging (pas les clés live).
  #
  # L'URL DOIT correspondre au préfixe de la clé : sk_sandbox_… → sandbox-api,
  # sk_live_… → api.fedapay.com. L'API refuse de démarrer si les deux divergent.
  # Le bac à sable FedaPay n'exécute PAS les versements (403) : en staging,
  #    les retraits sont simulés, quoi que dise FEDAPAY_ENABLE_PAYOUTS.
  Payments__FedaPay__BaseUrl: "${FEDAPAY_BASE_URL:-https://sandbox-api.fedapay.com/v1}"
  Payments__FedaPay__ApiKey: "${FEDAPAY_API_KEY:-}"
  Payments__FedaPay__WebhookSecret: "${FEDAPAY_WEBHOOK_SECRET:-}"
  # Active les VERSEMENTS réels FedaPay (retraits vendeur). false = payout simulé.
  Payments__FedaPay__EnablePayouts: "${FEDAPAY_ENABLE_PAYOUTS:-false}"
  # Cloudflare R2 — pièces KYB (bucket privé, idéalement un bucket de staging).
  Storage__CloudflareR2__AccountId: "${R2_ACCOUNT_ID:-}"
  Storage__CloudflareR2__AccessKeyId: "${R2_ACCESS_KEY_ID:-}"
  Storage__CloudflareR2__SecretAccessKey: "${R2_SECRET_ACCESS_KEY:-}"
  Storage__CloudflareR2__BucketName: "${R2_BUCKET_NAME:-}"
  Storage__CloudflareR2__PublicBaseUrl: "${R2_PUBLIC_BASE_URL:-}"
  # Cloudflare R2 — images produit (bucket public).
  Storage__CloudflareR2Media__AccountId: "${R2_ACCOUNT_ID:-}"
  Storage__CloudflareR2Media__AccessKeyId: "${R2_ACCESS_KEY_ID:-}"
  Storage__CloudflareR2Media__SecretAccessKey: "${R2_SECRET_ACCESS_KEY:-}"
  Storage__CloudflareR2Media__BucketName: "${R2_MEDIA_BUCKET_NAME:-}"
  Storage__CloudflareR2Media__PublicBaseUrl: "${R2_MEDIA_PUBLIC_BASE_URL:-}"
  Storage__CloudflareR2Media__KeyPrefix: "${R2_MEDIA_KEY_PREFIX:-}"
  # ─────────────────────────────────────────────────────────────────────────────
  # Détourage d'image — LOCAL par défaut (service `rembg` ci-dessous).
  #
  # Renseigné, il PRIME sur Cloudinary : pas de quota, pas de facture à l'usage, et
  # les photos des vendeurs ne quittent pas le VPS. Vider REMBG_URL fait retomber sur
  # Cloudinary ; vider les deux désactive proprement la fonction (image inchangée,
  # et les interfaces cessent de promettre un détourage).
  #
  # ⚠️ MODÈLE : « u2net » (Apache 2.0 / MIT). NE PAS basculer sur un modèle BRIA
  # (« bria-rmbg ») : ses poids sont en CC BY-NC 4.0, donc interdits sur une place de
  # marché. Le code refuse d'ailleurs de les activer.
  # ─────────────────────────────────────────────────────────────────────────────
  Media__Rembg__BaseUrl: "${REMBG_URL-http://rembg:7000}"
  Media__Rembg__Model: "${REMBG_MODEL:-u2net}"
  # Cloudinary — repli si le service local est désactivé. Secrets via .env non versionné.
  Media__Cloudinary__CloudName: "${CLOUDINARY_CLOUD_NAME:-}"
  Media__Cloudinary__ApiKey: "${CLOUDINARY_API_KEY:-}"
  Media__Cloudinary__ApiSecret: "${CLOUDINARY_API_SECRET:-}"
  # Firebase Cloud Messaging (push). Le JSON du compte de service est écrit par
  # Ansible (depuis le vault) dans deploy/fcm/service-account.json, monté en RO
  # dans chaque conteneur (voir volumes de x-app-common). Si le fichier est absent,
  # le module bascule automatiquement sur NullPushSender (aucun push, pas d'erreur).
  Notifications__Fcm__ServiceAccountPath: "/run/secrets/fcm/service-account.json"

  # E-mails transactionnels (Resend) : vérification d'adresse + reset mot de passe.
  # RESEND_API_KEY vient du vault ; EMAIL_FROM / EMAIL_APP_BASE_URL du group_vars.
  # Les trois vides = canal désactivé (DevelopmentEmailSender, aucun envoi réel).
  Notifications__Email__ApiKey: "${RESEND_API_KEY:-}"
  Notifications__Email__From: "${EMAIL_FROM:-}"
  Notifications__Email__AppBaseUrl: "${EMAIL_APP_BASE_URL:-}"

  # ── Service de dispatch (livraison par coursier) ────────────────────────────
  # Adresse INTERNE : la marketplace parle au dispatch par le réseau Docker, jamais par
  # Traefik. Sans elle, « commande prête » part dans l'outbox, échoue, et finit en lettre
  # morte — visible, mais aucune course n'est créée.
  Dispatch__BaseUrl: "${DISPATCH_BASE_URL:-http://dispatch:8080}"
  # Deux secrets DISTINCTS, un par sens : une fuite d'un côté ne doit pas ouvrir les deux.
  # ABSENTS = appels rejetés hors développement, des deux côtés.
  Dispatch__OutboundSecret: "${DISPATCH_OUTBOUND_SECRET:?DISPATCH_OUTBOUND_SECRET requis}"
  Delivery__WebhookSecret: "${DELIVERY_WEBHOOK_SECRET:?DELIVERY_WEBHOOK_SECRET requis}"
  # Plafond ABSOLU de rémunération d'une course. Le plafond RELATIF — jamais plus que les
  # frais de livraison encaissés sur la commande — s'applique toujours, sans réglage.
  Settlement__CourierPay__MaxAmount: "${COURIER_PAY_MAX_AMOUNT:-}"

x-app-common: &app-common
  restart: unless-stopped
  logging: *logging
  networks: [marketplace-net]
  # Compte de service Firebase (push FCM) monté en lecture seule dans TOUS les
  # hôtes (api + BFF). Le bff-admin en a besoin pour envoyer le push de test au
  # vendeur ; les autres pour les notifications déclenchées par leurs flux.
  volumes:
    - ./fcm:/run/secrets/fcm:ro
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 40s
  deploy:
    resources:
      limits:
        cpus: "0.75"
        memory: 512M

services:
  # ---------------- Redis (backplane + cache) ----------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD requis}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging
    networks: [marketplace-net]

  # ---------------- Détourage d'image (local, sans service tiers) ----------------
  # rembg — remplace Cloudinary pour le détourage IA des photos produit.
  #
  # ⚠️ AUCUN `ports:`, AUCUN label Traefik. CE SERVICE NE DOIT JAMAIS ÊTRE PUBLIÉ.
  # Il n'a ni authentification ni limitation de débit, et son endpoint GET
  # /api/remove va chercher une URL arbitraire (SSRF). Il n'est joignable que depuis
  # le réseau Docker interne, par l'API et les BFF.
  #
  # `--no-ui` coupe l'interface Gradio : inutile sur un serveur, et elle consomme du
  # CPU au repos.
  #
  # Le volume de cache est indispensable : sans lui, le conteneur retélécharge le
  # modèle (~176 Mo pour u2net) à CHAQUE redémarrage, et le premier vendeur qui
  # importe une photo attend ce téléchargement.
  rembg:
    # Version ÉPINGLÉE, pas `latest` : `--no-ui` n'existe pas avant la 2.0.75, et le
    # correctif de la CVE-2026-40086 (traversée de chemin, non authentifiée) y est
    # arrivé en même temps. Un `pull` qui ramènerait une image antérieure produirait
    # soit une boucle de redémarrage, soit une régression de sécurité silencieuse.
    image: danielgatis/rembg:2.0.77
    restart: unless-stopped
    # `--threads 2` BORNE LES INFÉRENCES SIMULTANÉES.
    #
    # Sans lui, rembg exécute chaque détourage dans le pool de threads anyio, dont la
    # limite par défaut est 40. Huit photos par vendeur, quelques vendeurs en même
    # temps, et le conteneur tente quarante inférences u2net de front : il est tué
    # pour dépassement mémoire bien avant de saturer le processeur.
    command: ["s", "--host", "0.0.0.0", "--port", "7000", "--no-ui", "--threads", "${REMBG_THREADS:-2}"]
    environment:
      # Threads INTERNES à une inférence ONNX. Ne borne PAS le nombre d'inférences
      # simultanées — c'est le rôle de `--threads` dans la commande ci-dessus.
      OMP_NUM_THREADS: "${REMBG_THREADS:-2}"
    volumes:
      # ⚠️ MONTÉ SUR /root/.u2net, l'emplacement PAR DÉFAUT — surtout pas ailleurs.
      #
      # L'image amont exécute `rembg d u2net` à la construction : u2net.onnx est déjà
      # dans une couche, à cet endroit. Le déplacer avec U2NET_HOME écartait ce
      # fichier et FORÇAIT un téléchargement de 176 Mo au premier appel — à
      # l'intérieur de la requête d'un vendeur, donc au-delà du délai imparti.
      #
      # Un volume nommé, lui, est initialisé avec le contenu du dossier de l'image :
      # le modèle est là dès le premier démarrage, et tout modèle téléchargé plus
      # tard survit aux redémarrages.
      - rembgmodels:/root/.u2net
    healthcheck:
      # `/api` est la page de documentation OpenAPI : elle ne charge aucun modèle, ce
      # qui en fait une sonde honnête (« le service répond ») sans coût de calcul.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/api').read()\""]
      interval: 30s
      timeout: 10s
      retries: 5
      # Généreux : le premier démarrage télécharge le modèle avant de répondre.
      start_period: 180s
    logging: *logging
    networks: [marketplace-net]
    deploy:
      resources:
        limits:
          # L'inférence u2net tient dans ~1,5 Go. La marge évite que le noyau ne tue
          # le conteneur en pleine requête sur un petit VPS.
          memory: "${REMBG_MEMORY:-2G}"
          cpus: "${REMBG_CPUS:-2}"

  # ---------------- Base de données (co-hébergée sur ce VPS) ----------------
  # Remplace Neon : Postgres local, JAMAIS exposé sur Internet (aucun `ports:`),
  # joignable uniquement sur le réseau Docker interne. La chaîne de connexion est
  # construite automatiquement par env.j2 dès que `postgres_password` est défini
  # dans le vault ET que `marketplace_connection` (Neon) en est retiré.
  #
  # Conf DÉDIÉE staging (petit VPS) : surtout pas la conf prod (4 Go shared_buffers).
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    shm_size: "128mb"
    # Écoute UNIQUEMENT sur la loopback de l'hôte (127.0.0.1) — JAMAIS sur Internet.
    # Sert l'accès admin (pgAdmin) via un TUNNEL SSH : seul quelqu'un connecté en SSH
    # au VPS peut atteindre ce port. Retirer cette ligne pour couper l'accès.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-marketplace}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.staging.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
    networks: [marketplace-net]
    deploy:
      resources:
        limits:
          memory: 1G

  # ---------------- Edge gateway (TLS staging) ----------------
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    environment:
      # Ubuntu 26.04 embarque un Docker qui refuse les vieilles API : on force une
      # version d'API moderne pour le client Docker interne de Traefik (sinon le
      # provider docker échoue « client version 1.24 is too old »).
      DOCKER_API_VERSION: "1.44"
    command:
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL requis}"
      # ACME staging par défaut (SANS rate-limit). Passer l'URL de prod pour des certificats fiables.
      - "--certificatesresolvers.letsencrypt.acme.caserver=${ACME_CASERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}"
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.staging.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic-staging:/etc/traefik/dynamic:ro
      - acme:/acme
    logging: *logging
    networks: [marketplace-net]

  # ---------------- Monolithe modulaire (migrateur) ----------------
  api:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bootstrap/Marketplace.Api/Marketplace.Api.csproj
        APP_DLL: Marketplace.Api.dll
    image: ${IMAGE_PREFIX:-marketplace}/api:${IMAGE_TAG:-staging}
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api.middlewares=edge-chain@file"
      - "traefik.http.services.api.loadbalancer.server.port=8080"

  # ---------------- BFF ----------------
  bff-client:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bff/Marketplace.Bff.Client/Marketplace.Bff.Client.csproj
        APP_DLL: Marketplace.Bff.Client.dll
    image: ${IMAGE_PREFIX:-marketplace}/bff-client:${IMAGE_TAG:-staging}
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "false"
      OUTBOX_ENABLED: "false"
      # Origines du SITE (navigateur). VIDE = REPLI FERMÉ : aucune origine acceptée.
      # Un repli ouvert avec AllowCredentials laisserait n'importe quel site agir au
      # nom d'un acheteur connecté — panier, adresses, paiement.
      Cors__Origins: "${CLIENT_WEB_ORIGINS:-}"

      # Fiche App Store de l'app STAGING (fr.hbamarket.app.staging).
      MobileApp__UpdateUrlIos: "https://apps.apple.com/app/id6793095820"
      DeepLink__AppStoreUrl: "https://apps.apple.com/app/id6793095820"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # ─────────────────────────────────────────────────────────────────────
      # « m. » EST UN NOM HISTORIQUE, ET IL RESTE.
      #
      # Cette surface ne sert plus seulement le mobile : depuis la fusion des BFF
      # Mobile et Web, elle sert aussi le site. Le renommer coûterait un
      # enregistrement DNS et un certificat, pour un gain cosmétique — et une
      # migration ratée sur l'hôte du checkout se paie cher.
      #
      # LE SITE PUBLIC N'EST PAS ICI. Il vivra sur `www.` (image hbaexpress-site,
      # pas encore déployée) et appellera ce BFF EN CROSS-ORIGIN : c'est ce que la
      # politique CORS ci-dessus autorise, et c'est pour cela qu'elle existe.
      # ─────────────────────────────────────────────────────────────────────
      - "traefik.http.routers.client.rule=Host(`m.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.client.entrypoints=websecure"
      - "traefik.http.routers.client.tls.certresolver=letsencrypt"
      - "traefik.http.routers.client.middlewares=edge-chain@file"
      - "traefik.http.services.client.loadbalancer.server.port=8080"


  bff-seller:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bff/Marketplace.Bff.Seller/Marketplace.Bff.Seller.csproj
        APP_DLL: Marketplace.Bff.Seller.dll
    image: ${IMAGE_PREFIX:-marketplace}/bff-seller:${IMAGE_TAG:-staging}
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "false"
      OUTBOX_ENABLED: "false"
      # Origine CORS du dashboard vendeur hébergé séparément (Blazor WASM
      # sur web-seller.hba-marketplace.fr → appels cross-origin vers ce BFF).
      Cors__Origins: "${SELLER_CORS_ORIGINS:-https://web-seller.hba-marketplace.fr}"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seller.rule=Host(`seller.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.seller.entrypoints=websecure"
      - "traefik.http.routers.seller.tls.certresolver=letsencrypt"
      - "traefik.http.routers.seller.middlewares=edge-chain@file"
      - "traefik.http.services.seller.loadbalancer.server.port=8080"

  bff-admin:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bff/Marketplace.Bff.Admin/Marketplace.Bff.Admin.csproj
        APP_DLL: Marketplace.Bff.Admin.dll
    image: ${IMAGE_PREFIX:-marketplace}/bff-admin:${IMAGE_TAG:-staging}
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "false"
      OUTBOX_ENABLED: "false"
      # --- CORS ---
      # La console d'administration est une application NAVIGATEUR servie depuis une
      # autre origine que l'API : sans déclaration explicite, la politique reste
      # FERMÉE (SetIsOriginAllowed(false)) et le navigateur bloque tout — pas de
      # message côté serveur, juste un échec CORS côté client.
      #
      # Liste séparée par des virgules. En développement, on y ajoute l'origine
      # locale de la console (ex. http://localhost:5318) — JAMAIS en production.
      Cors__Origins: "${ADMIN_CORS_ORIGINS:-https://admin.${ROOT_DOMAIN}}"
      # --- Supervision (page « Santé système ») ---
      # Surfaces surveillées : URLs INTERNES (noms de services sur le réseau).
      #
      # LA LISTE SUIT LE DÉCOUPAGE PAR AUDIENCE. « BFF Mobile » et « BFF Web » ont
      # fusionné en « BFF Client » ; « BFF Driveur » et le service de dispatch s'y
      # ajoutent. Une surface oubliée ici n'est pas surveillée — et son absence ne
      # produit aucune erreur, juste une ligne manquante que personne ne cherche.
      Monitoring__Surfaces__0__Name: "API"
      Monitoring__Surfaces__0__Url: "http://api:8080"
      Monitoring__Surfaces__1__Name: "BFF Client"
      Monitoring__Surfaces__1__Url: "http://bff-client:8080"
      Monitoring__Surfaces__2__Name: "BFF Vendeur"
      Monitoring__Surfaces__2__Url: "http://bff-seller:8080"
      Monitoring__Surfaces__3__Name: "BFF Admin"
      Monitoring__Surfaces__3__Url: "http://bff-admin:8080"
      Monitoring__Surfaces__4__Name: "BFF Driveur"
      Monitoring__Surfaces__4__Url: "http://bff-driver:8080"
      Monitoring__Surfaces__5__Name: "Service de dispatch"
      Monitoring__Surfaces__5__Url: "http://dispatch:8080"
      # KPIs live + liens Grafana (vides = masqués). Ex. PROMETHEUS_URL=http://prometheus:9090
      Monitoring__PrometheusUrl: "${PROMETHEUS_URL:-}"
      Monitoring__GrafanaUrl: "${GRAFANA_URL:-}"
      Monitoring__GrafanaEmbedUrl: "${GRAFANA_EMBED_URL:-}"
      Monitoring__PortainerUrl: "${PORTAINER_URL:-}"
      # Logs des conteneurs (panneau « Logs » de la page Système) via l'API Loki.
      Monitoring__LokiUrl: "${LOKI_URL:-}"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.admin.middlewares=edge-chain@file"
      - "traefik.http.services.admin.loadbalancer.server.port=8080"

  # ---------------------------------------------------------------------------
  # Console d'administration (Next.js) — le FRONT navigateur des administrateurs.
  # C'est ici que sont servies les pages publiques /reinitialiser-mot-de-passe et
  # /mot-de-passe-oublie (cibles des liens d'e-mail : EMAIL_APP_BASE_URL doit
  # pointer sur https://console.${ROOT_DOMAIN}).
  #
  # Image construite depuis le dépôt Admin_MP_Next (Dockerfile fourni) et poussée
  # au registre — la CI doit builder/pousser « console » comme les autres images.
  # Le navigateur n'appelle QUE /api/* de cette console ; celle-ci relaie en
  # interne vers le BFF Admin (ADMIN_BFF_URL=http://bff-admin:8080). Aucun jeton
  # ne transite par le JavaScript client.
  # ---------------------------------------------------------------------------
  # ---------------- Console VENDEUR (Next.js) ----------------
  # ⚠️ ORDRE DE MISE EN SERVICE — À LIRE AVANT LE PREMIER DÉPLOIEMENT.
  #
  # Ansible lance `docker compose up -d --no-build` sur TOUTE la pile. Si l'image
  # `seller-console` n'existe pas encore sur GHCR, ce déploiement ÉCHOUE — et il
  # emporte les autres services avec lui. C'est exactement le piège décrit plus bas
  # pour le service « site ».
  #
  # La console doit donc être publiée EN PREMIER : pousser sur `develop_staging`
  # (ou `develop`) dans HbaExpress_seller_dashboard, attendre que le workflow soit
  # vert, et seulement ensuite déployer le backend.
  # Image construite et poussée par le dépôt HbaExpress_seller_dashboard
  # (.github/workflows/deploy.yml), puis tirée ici. Ce compose ne la construit pas :
  # le backend et la console vivent dans deux dépôts distincts, avec deux cycles de
  # publication distincts.
  #
  # Le vendeur ne parle JAMAIS au BFF directement : la console détient les jetons dans
  # un cookie chiffré côté serveur et relaie les appels. D'où `SELLER_BFF_URL` sur
  # l'adresse INTERNE du réseau Docker — passer par l'URL publique ferait sortir puis
  # rentrer chaque requête par Traefik, et ferait perdre l'IP réelle du vendeur.
  seller-console:
    image: ${IMAGE_PREFIX:-marketplace}/seller-console:${IMAGE_TAG:-staging}
    restart: unless-stopped
    logging: *logging
    networks: [marketplace-net]
    environment:
      NODE_ENV: "production"
      SELLER_BFF_URL: "http://bff-seller:8080"
      # `:?` et non `:-` : ce secret CHIFFRE LA SESSION VENDEUR. Vide ou trop faible,
      # il la rend forgeable — donc le jeton de rafraîchissement d'un vendeur, valable
      # trente jours, devient extractible. La console refuse de servir sans lui ; ce
      # `:?` fait échouer le déploiement AVANT, ce qui est préférable à une pile qui
      # démarre et renvoie tout le monde vers la page de connexion.
      SESSION_SECRET: "${SELLER_SESSION_SECRET:?SELLER_SESSION_SECRET requis (openssl rand -base64 32, 32 caracteres minimum, pas une valeur d'exemple)}"
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      bff-seller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      # ─────────────────────────────────────────────────────────────────────────
      # NOM D'HÔTE COMPLET — pas forcément un sous-domaine de ${ROOT_DOMAIN}.
      #
      # En staging le défaut suffit : `pro.${ROOT_DOMAIN}`. La variable existe pour la
      # PROD, où la console vendeur est servie sur `pro.hba-express.com` alors que
      # toute l'infrastructure vit sous `hba-express.org`. Y écrire en dur
      # `pro.${ROOT_DOMAIN}` aurait produit `pro.hba-express.org` — un nom que
      # personne n'a demandé, et pour lequel Let's Encrypt aurait quand même émis un
      # certificat, donnant l'illusion que tout fonctionne.
      #
      # `pro.` et non `seller.` : ce dernier sert déjà le BFF vendeur. Deux routeurs
      # sur le même hôte, et Traefik en choisirait un au hasard.
      # ─────────────────────────────────────────────────────────────────────────
      - "traefik.http.routers.seller-console.rule=Host(`${SELLER_CONSOLE_DOMAIN:-pro.${ROOT_DOMAIN}}`)"
      - "traefik.http.routers.seller-console.entrypoints=websecure"
      - "traefik.http.routers.seller-console.tls.certresolver=letsencrypt"
      # edge-chain : HSTS, en-têtes de sécurité, limitation de débit de bordure.
      # L'omettre priverait la console de tout ce que Traefik apporte.
      - "traefik.http.routers.seller-console.middlewares=edge-chain@file"
      - "traefik.http.services.seller-console.loadbalancer.server.port=3000"

  console:
    image: ${IMAGE_PREFIX:-marketplace}/console:${IMAGE_TAG:-staging}
    restart: unless-stopped
    logging: *logging
    networks: [marketplace-net]
    environment:
      NODE_ENV: "production"
      # Cible SERVEUR-à-SERVEUR (réseau interne), jamais exposée au navigateur.
      ADMIN_BFF_URL: "http://bff-admin:8080"
      # Secret de chiffrement du cookie de session (vault → ADMIN_SESSION_SECRET).
      SESSION_SECRET: "${ADMIN_SESSION_SECRET:-}"
      # Derrière Traefik en HTTPS : cookie Secure obligatoire.
      SESSION_COOKIE_SECURE: "true"
    depends_on:
      bff-admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.console.rule=Host(`console.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.console.entrypoints=websecure"
      - "traefik.http.routers.console.tls.certresolver=letsencrypt"
      - "traefik.http.routers.console.middlewares=edge-chain@file"
      - "traefik.http.services.console.loadbalancer.server.port=3000"

  # NOTE : service « site » à ajouter quand l'image hbaexpress-site sera poussée
  # (sinon le déploiement backend échoue au `pull site` d'une image absente).

  # ---------------- BFF Driveur (coursier : compte + portefeuille) ----------------
  # Quatrième surface, découpée par AUDIENCE : la même API pour l'application mobile du
  # coursier et pour sa console web. Elle ne pilote AUCUNE course — celles-ci vivent dans
  # le service de dispatch, que l'application appelle directement.
  bff-driver:
    <<: *app-common
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: src/Bff/Marketplace.Bff.Driver/Marketplace.Bff.Driver.csproj
        APP_DLL: Marketplace.Bff.Driver.dll
    image: ${IMAGE_PREFIX:-marketplace}/bff-driver:${IMAGE_TAG:-staging}
    environment:
      <<: *app-env
      RunMigrationsAtStartup: "false"
      OUTBOX_ENABLED: "false"
      # Origines de la console web coursier. VIDE = REPLI FERMÉ : aucune origine
      # navigateur acceptée. Un repli ouvert avec AllowCredentials laisserait n'importe
      # quel site lire le portefeuille d'un coursier connecté.
      Cors__Origins: "${DRIVER_CONSOLE_ORIGINS:-}"
    depends_on:
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.driver.rule=Host(`driver.${ROOT_DOMAIN}`)"
      - "traefik.http.routers.driver.entrypoints=websecure"
      - "traefik.http.routers.driver.tls.certresolver=letsencrypt"
      - "traefik.http.routers.driver.middlewares=edge-chain@file"
      - "traefik.http.services.driver.loadbalancer.server.port=8080"

  # ---------------- Service de dispatch (coursiers) ----------------
  # Déployé à part du monolithe : il tient les courses, les offres et les positions de
  # coursier, et n'accède à AUCUNE base de la marketplace. Les deux ne communiquent que
  # par HTTP signé — voir docs/CDC_Service_Livraison_Coursier.md.
  dispatch:
    <<: *app-common
    # ANNULE le montage FCM hérité de *app-common : ce service n'envoie aucune
    # notification push, et un compte de service n'a rien à faire dans un conteneur qui
    # ne s'en sert pas. Le reste de l'ancre — santé, réseau, journalisation, limites —
    # est bien voulu.
    volumes: []
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PROJECT: Services/HbaExpress.Dispatch/src/HbaExpress.Dispatch.Api/HbaExpress.Dispatch.Api.csproj
        APP_DLL: HbaExpress.Dispatch.Api.dll
    image: ${IMAGE_PREFIX:-marketplace}/dispatch:${IMAGE_TAG:-staging}
    environment:
      ASPNETCORE_ENVIRONMENT: "Staging"
      # BASE SÉPARÉE, jamais celle de la marketplace (CDC §11) : ce service réécrit des
      # positions à la seconde, la marketplace tient de l'argent.
      ConnectionStrings__Dispatch: "${DISPATCH_CONNECTION:?DISPATCH_CONNECTION requis (base dediee au dispatch)}"
      # Ce service n'ÉMET aucun jeton : il VÉRIFIE ceux de la marketplace. La clé doit
      # être IDENTIQUE, sinon aucun coursier ne peut s'authentifier.
      Jwt__Issuer: "marketplace"
      Jwt__Audience: "marketplace"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?JWT_SIGNING_KEY requis}"
      # Adresse INTERNE de la marketplace : c'est par là que part l'annonce de course
      # livrée, celle qui crédite le coursier. Jamais par Traefik — la surface publique
      # de l'API ne route que les rappels des PSP.
      Marketplace__BaseUrl: "${MARKETPLACE_BASE_URL:-http://api:8080}"
      # Secrets CROISÉS : ce qu'on envoie doit valoir Delivery__WebhookSecret côté
      # marketplace ; ce qu'on reçoit doit valoir Dispatch__OutboundSecret là-bas.
      Marketplace__OutboundSecret: "${DELIVERY_WEBHOOK_SECRET:?DELIVERY_WEBHOOK_SECRET requis}"
      Marketplace__InboundSecret: "${DISPATCH_OUTBOUND_SECRET:?DISPATCH_OUTBOUND_SECRET requis}"
      # Part des frais de livraison versée au coursier. AUCUN DÉFAUT DANS LE CODE : le
      # service refuse de démarrer sans elle (CourierPayGuard). C'est une décision
      # commerciale — voir docs/PLAN_Reste_A_Faire.md §5.3.
      Dispatch__CourierShare: "${DISPATCH_COURIER_SHARE:?DISPATCH_COURIER_SHARE requis (ex. 0.80)}"
      # BACKPLANE SIGNALR. Sans lui, un coursier connecté à une instance ne recevrait
      # jamais une offre dispatchée par une autre : il la verrait au rattrapage, vingt
      # secondes plus tard, sur une fenêtre qui en dure vingt-cinq. Panne intermittente,
      # invisible tant qu'on ne tourne qu'à une instance.
      Redis__ConnectionString: "${DISPATCH_REDIS_CONNECTION:-redis:6379,password=${REDIS_PASSWORD:-},abortConnect=false}"
      Otel__Endpoint: "${OTEL_ENDPOINT:-}"
      RunMigrationsAtStartup: "true"
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      # ─────────────────────────────────────────────────────────────────────────
      # SEUL /api/courier EST PUBLIÉ. /internal NE L'EST PAS, ET NE DOIT JAMAIS L'ÊTRE.
      #
      # Les routes /internal créent des courses, en annulent, et décident du droit de
      # travailler d'un coursier. Leur authentification est une SIGNATURE, pas un jeton :
      # elles sont anonymes au sens ASP.NET. Fermées par défaut, oui — mais la première
      # défense est qu'elles ne soient pas joignables. Seule la marketplace les appelle,
      # par le réseau interne.
      #
      # L'ABSENCE DE ROUTE EST LE CONTRÔLE. Élargir cette règle « pour tester »
      # ouvrirait la création de courses à Internet.
      #
      # `/hubs/courier` est publié avec `/api/courier` : c'est le canal temps réel de la
      # même application mobile.
      # ─────────────────────────────────────────────────────────────────────────
      - "traefik.http.routers.dispatch.rule=Host(`dispatch.${ROOT_DOMAIN}`) && (PathPrefix(`/api/courier`) || PathPrefix(`/hubs/courier`))"
      - "traefik.http.routers.dispatch.entrypoints=websecure"
      - "traefik.http.routers.dispatch.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dispatch.middlewares=edge-chain@file"
      - "traefik.http.services.dispatch.loadbalancer.server.port=8080"

networks:
  marketplace-net:
    name: marketplace-staging-net

volumes:
  pgdata:
  redisdata:
  acme:
  # Cache des modèles ONNX de rembg : sans lui, ~176 Mo retéléchargés à chaque
  # redémarrage du conteneur.
  rembgmodels:
