# Routes déclaratives (provider file). Chaque surface est joignable de deux
# façons : par hôte (xxx.localhost, avec Swagger) et par préfixe sur localhost.
# Les services pointent vers les conteneurs par leur nom Docker (réseau interne,
# port 8080). La chaîne de middlewares « edge-chain » vit dans middlewares.yml.

http:
  routers:
    # --- Monolithe ---
    api-host:
      rule: "Host(`api.localhost`)"
      entryPoints: [web]
      service: api
      middlewares: [edge-chain]
    api-path:
      rule: "Host(`localhost`) && PathPrefix(`/api`)"
      entryPoints: [web]
      service: api
      middlewares: [edge-chain]

    # --- BFF Client (acheteur : mobile ET site) ---
    client-host:
      rule: "Host(`client.localhost`)"
      entryPoints: [web]
      service: client
      middlewares: [edge-chain]
    client-path:
      rule: "Host(`localhost`) && PathPrefix(`/client`)"
      entryPoints: [web]
      service: client
      middlewares: [edge-chain]
    # Accès depuis un appareil physique (téléphone) via l'IP LAN de l'hôte :
    # aucune règle d'hôte ne matche l'IP, donc on route le préfixe /client
    # quel que soit l'hôte. /client est exclusif au BFF Client : pas de conflit.
    client-lan:
      rule: "PathPrefix(`/client`)"
      entryPoints: [web]
      service: client
      middlewares: [edge-chain]
      priority: 1

    # --- BFF Vendeur ---
    seller-host:
      rule: "Host(`seller.localhost`)"
      entryPoints: [web]
      service: seller
      middlewares: [edge-chain]
    seller-path:
      rule: "Host(`localhost`) && PathPrefix(`/seller`)"
      entryPoints: [web]
      service: seller
      middlewares: [edge-chain]

    # --- BFF Admin ---
    admin-host:
      rule: "Host(`admin.localhost`)"
      entryPoints: [web]
      service: admin
      middlewares: [edge-chain]
    admin-path:
      rule: "Host(`localhost`) && PathPrefix(`/admin`)"
      entryPoints: [web]
      service: admin
      middlewares: [edge-chain]

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:8080"
    client:
      loadBalancer:
        servers:
          - url: "http://bff-client:8080"
    seller:
      loadBalancer:
        servers:
          - url: "http://bff-seller:8080"
    admin:
      loadBalancer:
        servers:
          - url: "http://bff-admin:8080"
