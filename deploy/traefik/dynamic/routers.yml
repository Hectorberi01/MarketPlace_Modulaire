# Routes déclaratives (provider file) pour le développement. L'hôte unique sert les
# trois surfaces sous /api ; il est joignable par nom (api.localhost, avec Swagger),
# par préfixe sur localhost, et par préfixe depuis l'IP LAN pour un téléphone.
# La chaîne de middlewares « edge-chain » vit dans middlewares.yml.

http:
  routers:
    api-host:
      rule: "Host(`api.localhost`)"
      entryPoints: [web]
      service: api
      middlewares: [edge-chain]
    api-path:
      rule: "Host(`localhost`) && PathPrefix(`/api`)"
      entryPoints: [web]
      service: api
      middlewares: [edge-chain]
    # Appareil physique (téléphone) par l'IP LAN de la machine : aucune règle d'hôte
    # ne matche une IP, donc on route /api quel que soit l'hôte.
    api-lan:
      rule: "PathPrefix(`/api`)"
      entryPoints: [web]
      service: api
      middlewares: [edge-chain]
      priority: 1

  services:
    api:
      loadBalancer:
        servers:
          - url: "http://api:8080"
