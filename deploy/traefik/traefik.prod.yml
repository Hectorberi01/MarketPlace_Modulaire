# Configuration STATIQUE de Traefik — PRODUCTION.
# TLS automatique via Let's Encrypt (challenge TLS-ALPN sur 443), redirection
# globale HTTP→HTTPS, routes découvertes par labels Docker, middlewares partagés
# via le provider « file » (./dynamic-prod). Dashboard désactivé.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  # Point d'entrée INTERNE pour les métriques Prometheus (non publié vers Internet ;
  # scrapé par Prometheus sur le réseau Docker : http://traefik:8082/metrics).
  metrics:
    address: ":8082"

# Dashboard/API désactivés en production (aucune exposition).
api:
  dashboard: false
  insecure: false

# Métriques Prometheus (requêtes, codes de statut, latences par routeur/service).
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

providers:
  # Routers/services découverts via les labels Docker du compose (interpolés avec
  # ${ROOT_DOMAIN}). Rien n'est exposé sans label « traefik.enable=true ».
  docker:
    exposedByDefault: false
    network: marketplace-prod-net
  # Middlewares partagés (chaîne edge : sécurité, rate-limit, gzip).
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # email fourni via le flag --certificatesresolvers.letsencrypt.acme.email
      # (injecté depuis ${ACME_EMAIL} dans docker-compose.prod.yml).
      storage: /acme/acme.json
      tlsChallenge: {}

log:
  level: INFO

accessLog: {}
