# Configuration DYNAMIQUE (provider file) — STAGING.
# Comme la prod, mais SANS preload HSTS (certificats ACME staging non fiables,
# on évite d'ancrer le HTTPS dans le navigateur pour un domaine de test).

http:
  middlewares:
    sec-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          X-Gateway: "traefik-staging"
          X-Environment: "staging"
          Server: ""

    rate-limit:
      rateLimit:
        average: 200
        burst: 100

    gzip:
      compress: {}

    edge-chain:
      chain:
        middlewares:
          - sec-headers
          - rate-limit
          - gzip
