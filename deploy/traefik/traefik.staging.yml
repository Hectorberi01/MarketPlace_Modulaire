# Configuration STATIQUE de Traefik — STAGING.
# Identique à la prod, mais l'e-mail ET le serveur ACME (staging par défaut)
# sont injectés en flags depuis docker-compose.staging.yml.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
  # Point d'entrée INTERNE pour les métriques Prometheus (non publié vers Internet ;
  # scrapé par Prometheus sur le réseau Docker : http://traefik:8082/metrics).
  metrics:
    address: ":8082"

api:
  dashboard: false
  insecure: false

# Métriques Prometheus (requêtes, codes de statut, latences par routeur/service).
metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

providers:
  docker:
    exposedByDefault: false
    network: marketplace-staging-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # email + caServer fournis via les flags du service traefik (compose).
      storage: /acme/acme.json
      tlsChallenge: {}

log:
  level: INFO

accessLog: {}
