# Configuration STATIQUE de Traefik — STAGING.
# Identique à la prod, mais l'e-mail ET le serveur ACME (staging par défaut)
# sont injectés en flags depuis docker-compose.staging.yml.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

api:
  dashboard: false
  insecure: false

providers:
  docker:
    exposedByDefault: false
    network: marketplace-staging-net
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # email + caServer fournis via les flags du service traefik (compose).
      storage: /acme/acme.json
      tlsChallenge: {}

log:
  level: INFO

accessLog: {}
