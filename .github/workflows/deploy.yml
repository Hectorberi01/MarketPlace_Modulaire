name: Backend · build & deploy

# CI/CD du backend (API + BFF) :
#   push sur develop_staging → environnement STAGING (tag d'image « staging »)
#   push sur develop         → environnement PROD    (tag d'image « latest »)
#
# Enchaînement : garde-fou .NET (build + tests) → build & push des 5 images sur
# GHCR → déploiement Ansible sur le VPS (le serveur ne fait que PULL, use_registry).
#
# Secrets requis (Settings → Secrets and variables → Actions, environnement « deploy ») :
#   DEPLOY_SSH_KEY_STAGING  clé privée SSH autorisée sur le VPS de recette
#   DEPLOY_SSH_KEY_PROD     clé privée SSH autorisée sur le VPS de production
#   ANSIBLE_VAULT_PASSWORD  mot de passe du vault Ansible (commun aux deux)
#
# ⚠️ UNE CLÉ PAR ENVIRONNEMENT, ET C'EST DÉLIBÉRÉ.
#
# Un secret unique `DEPLOY_SSH_KEY` servait auparavant aux deux cibles. Deux
# serveurs, deux hébergeurs (Hetzner pour la recette, OVH pour la production),
# deux utilisateurs (`root:22` et `ubuntu:8022`) : rien ne garantissait qu'une même
# clé soit installée sur les deux. Réparer l'accès à l'un cassait silencieusement
# l'autre, et la panne n'apparaissait qu'à la livraison suivante — sur la mauvaise
# branche, au mauvais moment.
#
# Séparer les clés supprime ce couplage : toucher à la recette ne peut plus
# atteindre la production.

on:
  push:
    branches: [develop_staging, develop]
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/hectorberi01
  # develop → prod (latest) ; sinon staging.
  IMAGE_TAG: ${{ github.ref_name == 'develop' && 'latest' || 'staging' }}
  ENV_NAME: ${{ github.ref_name == 'develop' && 'prod' || 'staging' }}

jobs:
  build-test:
    name: Garde-fou .NET (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore Marketplace.sln
      - run: dotnet build Marketplace.sln -c Release --no-restore
      - run: dotnet test Marketplace.sln -c Release --no-build --verbosity minimal

  images:
    name: Build & push images (GHCR)
    needs: build-test
    runs-on: ubuntu-latest
    # Secrets stockés dans l'environnement « deploy » (GHCR_TOKEN, etc.).
    environment: deploy
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Préflight — GHCR_TOKEN présent ?
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::error::Secret GHCR_TOKEN absent/mal nommé dans CE dépôt → on retomberait sur GITHUB_TOKEN (403 attendu)."
            exit 1
          fi
          echo "GHCR_TOKEN présent (longueur ${#GHCR_TOKEN})."
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          # PAT (write:packages) si défini, sinon le token intégré. Le PAT évite le
          # 403 quand les packages existent déjà hors du dépôt.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
      - name: build-and-push.sh (api + 4 BFF, linux/amd64)
        run: |
          chmod +x deploy/build-and-push.sh
          ./deploy/build-and-push.sh
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          PLATFORM: linux/amd64

  deploy:
    name: Déploiement Ansible (${{ github.ref_name == 'develop' && 'prod' || 'staging' }})
    needs: images
    runs-on: ubuntu-latest
    # Secrets stockés dans l'environnement « deploy » : DEPLOY_SSH_KEY_STAGING,
    # DEPLOY_SSH_KEY_PROD et ANSIBLE_VAULT_PASSWORD.
    environment: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Ansible + collections
        run: |
          pip install --upgrade ansible
          ansible-galaxy collection install -r deploy/ansible/requirements.yml
      - name: Clé SSH + fichier vault
        env:
          # Passées par l'environnement, jamais interpolées dans le script : une
          # clé privée injectée directement dans le shell finirait dans les traces
          # d'exécution au premier `set -x`.
          SSH_KEY_STAGING: ${{ secrets.DEPLOY_SSH_KEY_STAGING }}
          SSH_KEY_PROD: ${{ secrets.DEPLOY_SSH_KEY_PROD }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # La branche a déjà déterminé ENV_NAME (staging | prod) ; on choisit la clé
          # correspondante. Aucun repli sur l'autre environnement : livrer en
          # production avec la clé de recette n'aurait aucun sens.
          if [ "$ENV_NAME" = "prod" ]; then
            DEPLOY_KEY="$SSH_KEY_PROD"
            SECRET_NAME="DEPLOY_SSH_KEY_PROD"
          else
            DEPLOY_KEY="$SSH_KEY_STAGING"
            SECRET_NAME="DEPLOY_SSH_KEY_STAGING"
          fi

          if [ -z "$DEPLOY_KEY" ]; then
            echo "::error::Secret $SECRET_NAME absent ou vide pour l'environnement « $ENV_NAME »."
            echo "Settings → Secrets and variables → Actions → environnement « deploy »."
            exit 1
          fi

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "$RUNNER_TEMP/vault.pass"
          chmod 600 "$RUNNER_TEMP/vault.pass"

          # ─────────────────────────────────────────────────────────────────────
          # CONTRÔLE DE LA CLÉ — l'échec doit se produire ICI, pas 30 secondes plus
          # tard sous la forme d'un « Permission denied (publickey) » d'Ansible.
          #
          # Ce message est le même que la clé soit ILLISIBLE (secret tronqué, collé
          # avec des retours chariot Windows, en-tête manquant) ou simplement ABSENTE
          # du `authorized_keys` du serveur. Deux causes très différentes, un seul
          # symptôme : on perd un temps considérable à chercher du mauvais côté.
          #
          # `ssh-keygen -y` échoue si la clé privée n'est pas exploitable, ce qui
          # tranche immédiatement entre les deux. L'EMPREINTE affichée n'est pas un
          # secret : elle se compare directement à la sortie de
          #     ssh-keygen -lf /root/.ssh/authorized_keys
          # exécutée sur le serveur.
          # ─────────────────────────────────────────────────────────────────────
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub 2>/dev/null; then
            echo "::error::$SECRET_NAME illisible — clé privée tronquée, mal collée ou protégée par passphrase."
            echo "Le secret doit contenir la clé ENTIÈRE, lignes BEGIN/END comprises, sans passphrase."
            exit 1
          fi
          echo "Environnement : $ENV_NAME  (secret : $SECRET_NAME)"
          echo "Empreinte de la clé de déploiement :"
          ssh-keygen -lf ~/.ssh/id_ed25519.pub
          echo "Elle doit figurer dans ~/.ssh/authorized_keys du serveur cible."
      - name: ansible-playbook (tags deploy)
        working-directory: deploy/ansible
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
        run: |
          # docker,setup : installe Docker si absent (idempotent).
          # deploy : synchronise le code, génère l'env, pull les images, up la stack.
          # monitoring,portainer,webterminal,dbadmin : stacks annexes (gated par
          #   enable_* dans group_vars ; sans ces tags, leurs rôles sont sautés
          #   même si enable_*=true).
          ansible-playbook -i "inventories/${ENV_NAME}/hosts.ini" site.yml \
            --tags docker,setup,security,deploy,monitoring,portainer,webterminal,dbadmin \
            --vault-password-file "$RUNNER_TEMP/vault.pass"
